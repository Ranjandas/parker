# The built-in fake service calls its upstreams and nests their answers:
# web -> api through web's sidecar (upstreams:), api -> db through api's
# transparent proxy (db.virtual.consul). One request to web shows all
# three hops. db starts slowly (ready.delay), and up waits for its /ready.
# web also calls rpc over gRPC and cache over TCP, through its sidecar.
parker: v1alpha1
name: fake-chain
versions: { consul: 1.22.7, envoy: 1.35.12 }
consul:
  datacenters:
    dc1:
      servers: 1
      service_defaults: { run: fake-service }
      nodes:
        web:
          service:
            port: 8080
            connect: sidecar
            upstreams: { api: 9091, rpc: 9092, cache: 9093 }
            fake: { version: v1, upstreams: ["http://127.0.0.1:9091/", "grpc://127.0.0.1:9092", "tcp://127.0.0.1:9093"] }
        api:
          service: { port: 9090, connect: tproxy, fake: { upstreams: ["http://db.virtual.consul:7000/"] } }
        db:
          service: { port: 7000, connect: sidecar, fake: { message: rows, ready: { delay: 3s } } }
        rpc:
          service: { port: 7100, connect: sidecar, fake: { protocol: grpc } }
        cache:
          service: { port: 7200, connect: sidecar, fake: { protocol: tcp } }

scenario:
  steps:
    - wait: dc1 ready
    - assert: { consul: { service_healthy: web-sidecar-proxy }, within: 60s }
    - assert: { consul: { service_healthy: api-sidecar-proxy }, within: 60s }
    - assert: { consul: { service_healthy: db-sidecar-proxy }, within: 60s }
    - assert: { consul: { service_healthy: rpc-sidecar-proxy }, within: 60s }
    - assert: { consul: { service_healthy: cache-sidecar-proxy }, within: 60s }
    - name: one request to web reaches db through two proxies
      assert:
        exec: { on: dc1/web, run: "curl -sf -m 5 http://127.0.0.1:8080/", output: '"body":"rows"' }
        within: 60s
    - name: a call assertion sees the chain reach db
      assert: { call: { on: dc1/web, reaches: dc1/db, body: rows }, within: 30s }
    - name: every hop answered 200
      assert:
        exec: { on: dc1/web, run: "curl -sf -m 5 http://127.0.0.1:8080/ | grep -o '\"code\":200' | wc -l | grep -qx 5" }
        within: 30s
    - name: rpc answers over gRPC and cache over TCP
      assert:
        exec: { on: dc1/web, run: "curl -sf -m 5 http://127.0.0.1:8080/ | grep -q '\"type\":\"gRPC\"' && curl -sf -m 5 http://127.0.0.1:8080/ | grep -q '\"type\":\"TCP\"'" }
    - name: Consul checks rpc over gRPC health and cache over TCP
      assert:
        exec: { on: dc1/server-1, run: "curl -sf http://127.0.0.1:8500/v1/health/checks/rpc | grep -q '\"Type\":\"grpc\"' && curl -sf http://127.0.0.1:8500/v1/health/checks/cache | grep -q '\"Type\":\"tcp\"'" }
    - name: rpc gets service-defaults protocol grpc
      assert:
        exec: { on: dc1/server-1, run: "curl -sf http://127.0.0.1:8500/v1/config/service-defaults/rpc | grep -q '\"Protocol\":\"grpc\"'" }
    - name: the Consul check uses /health
      assert:
        exec: { on: dc1/server-1, run: "curl -sf http://127.0.0.1:8500/v1/health/checks/db | grep -q 7000/health" }
        within: 30s
    - name: a caller can fail one request at a hop further down
      assert:
        exec: { on: dc1/web, run: "curl -s -o /dev/null -w '%{http_code}' -H 'X-Parker-Fault: db=error-rate:100' http://127.0.0.1:8080/", output: "500" }
    - name: and only that request
      assert:
        exec: { on: dc1/web, run: "curl -sf -m 5 http://127.0.0.1:8080/" }
    - name: db fails its check while it keeps running
      fake: { on: dc1/db, health: { code: 503 } }
    - assert:
        exec: { on: dc1/server-1, run: "curl -sf http://127.0.0.1:8500/v1/health/checks/db | grep -q '\"Status\":\"critical\"'" }
        within: 30s
    - assert:
        exec: { on: dc1/db, run: "curl -sf -m 2 http://127.0.0.1:7000/" }
    - fake: { on: dc1/db, reset: true }
    - assert:
        exec: { on: dc1/server-1, run: "curl -sf http://127.0.0.1:8500/v1/health/checks/db | grep -q '\"Status\":\"passing\"'" }
        within: 30s
    - name: a failing TCP fake stops listening, so its check goes critical
      fake: { on: dc1/cache, health: { code: 503 } }
    - assert:
        exec: { on: dc1/server-1, run: "curl -sf http://127.0.0.1:8500/v1/health/checks/cache | grep -q '\"Status\":\"critical\"'" }
        within: 30s
    - fake: { on: dc1/cache, reset: true }
    - assert:
        exec: { on: dc1/server-1, run: "curl -sf http://127.0.0.1:8500/v1/health/checks/cache | grep -q '\"Status\":\"passing\"'" }
        within: 30s
