parker: v1alpha1
name: vault-connect-ca
versions:
  consul: 1.22.7
  envoy: 1.35.12
  vault: 1.21.1
networks:
  dc1-lan:
    subnet: 10.1.0.0/24
    gateway: 10.1.0.1
    auto: true
  east-lan:
    subnet: 10.64.0.0/24
    gateway: 10.64.0.1
    auto: true
nodes:
  dc1-api:
    networks:
      dc1-lan:
        ip: 10.1.0.100
    files:
      consul.json: |
        {
          "advertise_addr": "10.1.0.100",
          "bind_addr": "10.1.0.100",
          "client_addr": "0.0.0.0",
          "data_dir": "${node_dir}/data",
          "datacenter": "dc1",
          "disable_update_check": true,
          "log_level": "INFO",
          "node_name": "api",
          "ports": {
            "grpc": 8502
          },
          "primary_datacenter": "dc1",
          "retry_interval": "1s",
          "retry_join": [
            "10.1.0.10",
            "10.1.0.11",
            "10.1.0.12"
          ],
          "server": false,
          "services": [
            {
              "check": {
                "http": "http://127.0.0.1:9090/health",
                "interval": "2s"
              },
              "connect": {
                "sidecar_service": {
                  "port": 21000,
                  "proxy": {}
                }
              },
              "name": "api",
              "port": 9090
            }
          ]
        }
    processes:
      api:
        run:
          - ${parker}
          - fake-service
          - --name
          - api
          - --port
          - "9090"
          - --dc
          - dc1
          - --control
          - ${node_dir}/api.fake.sock
        env:
          PARKER_FAKE: "{}"
        depends_on:
          dc1-api/consul:
            condition: started
        ready_when:
          port: 9090
          http:
            url: http://127.0.0.1:9090/ready
            status: 200
          consul:
            service_healthy: api
          timeout: 60s
      api-sidecar:
        run:
          - consul
          - connect
          - envoy
          - -sidecar-for
          - api
          - -admin-bind
          - 127.0.0.1:19000
          - --
          - --log-level
          - info
        uses:
          - envoy
        env:
          CONSUL_GRPC_ADDR: 127.0.0.1:8502
          CONSUL_HTTP_ADDR: 127.0.0.1:8500
        depends_on:
          dc1-api/consul:
            condition: ready
        ready_when:
          http:
            url: http://127.0.0.1:19000/ready
          timeout: 60s
        restart: on-failure
      consul:
        run:
          - consul
          - agent
          - -config-file=${node_dir}/consul.json
        depends_on:
          dc1-server-1/consul:
            condition: ready
          dc1-server-2/consul:
            condition: ready
          dc1-server-3/consul:
            condition: ready
        ready_when:
          consul:
            members: ">=4"
          timeout: 60s
    labels:
      product: consul
      dc: dc1
      name: api
      role: client
      group: api
      services:
        - api
  dc1-server-1:
    networks:
      dc1-lan:
        ip: 10.1.0.10
      east-lan:
        ip: 10.64.0.200
    files:
      consul.json: |
        {
          "advertise_addr": "10.1.0.10",
          "bind_addr": "10.1.0.10",
          "bootstrap_expect": 3,
          "client_addr": "0.0.0.0",
          "connect": {
            "ca_config": {
              "address": "http://10.64.0.10:8200",
              "intermediate_pki_path": "connect-dc1-intermediate/",
              "root_pki_path": "connect-root/",
              "token": "00000000-0000-4000-8000-000000000000"
            },
            "ca_provider": "vault",
            "enabled": true
          },
          "data_dir": "${node_dir}/data",
          "datacenter": "dc1",
          "disable_update_check": true,
          "log_level": "INFO",
          "node_name": "server-1",
          "primary_datacenter": "dc1",
          "retry_interval": "1s",
          "retry_join": [
            "10.1.0.11",
            "10.1.0.12"
          ],
          "server": true,
          "ui_config": {
            "enabled": true
          }
        }
    processes:
      consul:
        run:
          - consul
          - agent
          - -config-file=${node_dir}/consul.json
        depends_on:
          east-vault-1/vault-init:
            condition: ready
        ready_when:
          consul:
            leader: true
          timeout: 90s
    labels:
      product: consul
      dc: dc1
      name: server-1
      role: server
  dc1-server-2:
    networks:
      dc1-lan:
        ip: 10.1.0.11
      east-lan:
        ip: 10.64.0.201
    files:
      consul.json: |
        {
          "advertise_addr": "10.1.0.11",
          "bind_addr": "10.1.0.11",
          "bootstrap_expect": 3,
          "client_addr": "0.0.0.0",
          "connect": {
            "ca_config": {
              "address": "http://10.64.0.10:8200",
              "intermediate_pki_path": "connect-dc1-intermediate/",
              "root_pki_path": "connect-root/",
              "token": "00000000-0000-4000-8000-000000000000"
            },
            "ca_provider": "vault",
            "enabled": true
          },
          "data_dir": "${node_dir}/data",
          "datacenter": "dc1",
          "disable_update_check": true,
          "log_level": "INFO",
          "node_name": "server-2",
          "primary_datacenter": "dc1",
          "retry_interval": "1s",
          "retry_join": [
            "10.1.0.10",
            "10.1.0.12"
          ],
          "server": true,
          "ui_config": {
            "enabled": false
          }
        }
    processes:
      consul:
        run:
          - consul
          - agent
          - -config-file=${node_dir}/consul.json
        depends_on:
          east-vault-1/vault-init:
            condition: ready
        ready_when:
          consul:
            leader: true
          timeout: 90s
    labels:
      product: consul
      dc: dc1
      name: server-2
      role: server
  dc1-server-3:
    networks:
      dc1-lan:
        ip: 10.1.0.12
      east-lan:
        ip: 10.64.0.202
    files:
      consul.json: |
        {
          "advertise_addr": "10.1.0.12",
          "bind_addr": "10.1.0.12",
          "bootstrap_expect": 3,
          "client_addr": "0.0.0.0",
          "connect": {
            "ca_config": {
              "address": "http://10.64.0.10:8200",
              "intermediate_pki_path": "connect-dc1-intermediate/",
              "root_pki_path": "connect-root/",
              "token": "00000000-0000-4000-8000-000000000000"
            },
            "ca_provider": "vault",
            "enabled": true
          },
          "data_dir": "${node_dir}/data",
          "datacenter": "dc1",
          "disable_update_check": true,
          "log_level": "INFO",
          "node_name": "server-3",
          "primary_datacenter": "dc1",
          "retry_interval": "1s",
          "retry_join": [
            "10.1.0.10",
            "10.1.0.11"
          ],
          "server": true,
          "ui_config": {
            "enabled": false
          }
        }
    processes:
      consul:
        run:
          - consul
          - agent
          - -config-file=${node_dir}/consul.json
        depends_on:
          east-vault-1/vault-init:
            condition: ready
        ready_when:
          consul:
            leader: true
          timeout: 90s
    labels:
      product: consul
      dc: dc1
      name: server-3
      role: server
  dc1-web:
    networks:
      dc1-lan:
        ip: 10.1.0.101
    files:
      consul.json: |
        {
          "advertise_addr": "10.1.0.101",
          "bind_addr": "10.1.0.101",
          "client_addr": "0.0.0.0",
          "data_dir": "${node_dir}/data",
          "datacenter": "dc1",
          "disable_update_check": true,
          "log_level": "INFO",
          "node_name": "web",
          "ports": {
            "grpc": 8502
          },
          "primary_datacenter": "dc1",
          "retry_interval": "1s",
          "retry_join": [
            "10.1.0.10",
            "10.1.0.11",
            "10.1.0.12"
          ],
          "server": false,
          "services": [
            {
              "check": {
                "http": "http://127.0.0.1:8080/health",
                "interval": "2s"
              },
              "connect": {
                "sidecar_service": {
                  "port": 21000,
                  "proxy": {
                    "upstreams": [
                      {
                        "destination_name": "api",
                        "local_bind_port": 9091
                      }
                    ]
                  }
                }
              },
              "name": "web",
              "port": 8080
            }
          ]
        }
    processes:
      consul:
        run:
          - consul
          - agent
          - -config-file=${node_dir}/consul.json
        depends_on:
          dc1-server-1/consul:
            condition: ready
          dc1-server-2/consul:
            condition: ready
          dc1-server-3/consul:
            condition: ready
        ready_when:
          consul:
            members: ">=4"
          timeout: 60s
      web:
        run:
          - ${parker}
          - fake-service
          - --name
          - web
          - --port
          - "8080"
          - --dc
          - dc1
          - --control
          - ${node_dir}/web.fake.sock
        env:
          PARKER_FAKE: "{\"upstreams\":[\"http://127.0.0.1:9091/\"]}"
        depends_on:
          dc1-web/consul:
            condition: started
        ready_when:
          port: 8080
          http:
            url: http://127.0.0.1:8080/ready
            status: 200
          consul:
            service_healthy: web
          timeout: 60s
      web-sidecar:
        run:
          - consul
          - connect
          - envoy
          - -sidecar-for
          - web
          - -admin-bind
          - 127.0.0.1:19000
          - --
          - --log-level
          - info
        uses:
          - envoy
        env:
          CONSUL_GRPC_ADDR: 127.0.0.1:8502
          CONSUL_HTTP_ADDR: 127.0.0.1:8500
        depends_on:
          dc1-web/consul:
            condition: ready
        ready_when:
          http:
            url: http://127.0.0.1:19000/ready
          timeout: 60s
        restart: on-failure
    labels:
      product: consul
      dc: dc1
      name: web
      role: client
      group: web
      services:
        - web
  east-vault-1:
    networks:
      east-lan:
        ip: 10.64.0.10
    files:
      data/.keep: ""
      vault-init.json: |
        {
          "addrs": [
            "http://10.64.0.10:8200",
            "http://10.64.0.11:8200",
            "http://10.64.0.12:8200"
          ],
          "root_token": "00000000-0000-4000-8000-000000000000",
          "keys_file": "${node_dir}/vault-keys.json"
        }
      vault.json: |
        {
          "api_addr": "http://10.64.0.10:8200",
          "cluster_addr": "https://10.64.0.10:8201",
          "disable_mlock": true,
          "listener": {
            "tcp": {
              "address": "0.0.0.0:8200",
              "cluster_address": "10.64.0.10:8201",
              "tls_disable": true
            }
          },
          "storage": {
            "raft": {
              "node_id": "vault-1",
              "path": "${node_dir}/data",
              "retry_join": [
                {
                  "leader_api_addr": "http://10.64.0.11:8200"
                },
                {
                  "leader_api_addr": "http://10.64.0.12:8200"
                }
              ]
            }
          },
          "ui": true
        }
    processes:
      vault:
        run:
          - vault
          - server
          - -config=${node_dir}/vault.json
        ready_when:
          http:
            url: http://127.0.0.1:8200/v1/sys/health?standbyok=true&perfstandbyok=true&sealedcode=200&uninitcode=200
          timeout: 90s
      vault-init:
        run:
          - ${parker}
          - vault-init
          - ${node_dir}/vault-init.json
        depends_on:
          east-vault-1/vault:
            condition: started
          east-vault-2/vault:
            condition: started
          east-vault-3/vault:
            condition: started
        ready_when:
          log: "parker: vault initialised and unsealed"
          timeout: 90s
    labels:
      product: vault
      dc: east
      name: vault-1
      role: server
      group: vault
  east-vault-2:
    networks:
      east-lan:
        ip: 10.64.0.11
    files:
      data/.keep: ""
      vault.json: |
        {
          "api_addr": "http://10.64.0.11:8200",
          "cluster_addr": "https://10.64.0.11:8201",
          "disable_mlock": true,
          "listener": {
            "tcp": {
              "address": "0.0.0.0:8200",
              "cluster_address": "10.64.0.11:8201",
              "tls_disable": true
            }
          },
          "storage": {
            "raft": {
              "node_id": "vault-2",
              "path": "${node_dir}/data",
              "retry_join": [
                {
                  "leader_api_addr": "http://10.64.0.10:8200"
                },
                {
                  "leader_api_addr": "http://10.64.0.12:8200"
                }
              ]
            }
          },
          "ui": true
        }
    processes:
      vault:
        run:
          - vault
          - server
          - -config=${node_dir}/vault.json
        ready_when:
          http:
            url: http://127.0.0.1:8200/v1/sys/health?standbyok=true&perfstandbyok=true&sealedcode=200&uninitcode=200
          timeout: 90s
    labels:
      product: vault
      dc: east
      name: vault-2
      role: server
      group: vault
  east-vault-3:
    networks:
      east-lan:
        ip: 10.64.0.12
    files:
      data/.keep: ""
      vault.json: |
        {
          "api_addr": "http://10.64.0.12:8200",
          "cluster_addr": "https://10.64.0.12:8201",
          "disable_mlock": true,
          "listener": {
            "tcp": {
              "address": "0.0.0.0:8200",
              "cluster_address": "10.64.0.12:8201",
              "tls_disable": true
            }
          },
          "storage": {
            "raft": {
              "node_id": "vault-3",
              "path": "${node_dir}/data",
              "retry_join": [
                {
                  "leader_api_addr": "http://10.64.0.10:8200"
                },
                {
                  "leader_api_addr": "http://10.64.0.11:8200"
                }
              ]
            }
          },
          "ui": true
        }
    processes:
      vault:
        run:
          - vault
          - server
          - -config=${node_dir}/vault.json
        ready_when:
          http:
            url: http://127.0.0.1:8200/v1/sys/health?standbyok=true&perfstandbyok=true&sealedcode=200&uninitcode=200
          timeout: 90s
    labels:
      product: vault
      dc: east
      name: vault-3
      role: server
      group: vault
scenario:
  steps:
    - wait: dc1 ready
    - assert:
        exec:
          "on": dc1/server-1
          run: consul connect ca get-config
          output: "\"Provider\": \"vault\""
        within: 30s
    - assert:
        exec:
          "on": east/vault-1
          run: vault secrets list
          output: connect-dc1-intermediate/
        within: 30s
    - assert:
        consul:
          service_healthy: api-sidecar-proxy
        within: 60s
    - name: web reaches api through the mesh, on Vault-signed certificates
      assert:
        exec:
          "on": dc1/web
          run: curl -sf -m 2 http://127.0.0.1:9091/
          output: api
        within: 60s
