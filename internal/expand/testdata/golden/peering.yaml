parker: v1alpha1
name: peering
versions:
  consul: 1.22.7
  envoy: 1.35.12
networks:
  dc1-lan:
    subnet: 10.1.0.0/24
    gateway: 10.1.0.1
    auto: true
  dc2-lan:
    subnet: 10.2.0.0/24
    gateway: 10.2.0.1
    auto: true
  wan:
    subnet: 10.255.0.0/24
    gateway: 10.255.0.1
    auto: true
nodes:
  dc1-mesh:
    networks:
      dc1-lan:
        ip: 10.1.0.100
      wan:
        ip: 10.255.0.200
    files:
      consul.json: |
        {
          "advertise_addr": "10.1.0.100",
          "bind_addr": "10.1.0.100",
          "client_addr": "0.0.0.0",
          "data_dir": "${node_dir}/data",
          "datacenter": "dc1",
          "disable_update_check": true,
          "log_level": "INFO",
          "node_name": "mesh",
          "ports": {
            "grpc": 8502
          },
          "primary_datacenter": "dc1",
          "retry_interval": "1s",
          "retry_join": [
            "10.1.0.10"
          ],
          "server": false
        }
    processes:
      consul:
        run:
          - consul
          - agent
          - -config-file=${node_dir}/consul.json
        depends_on:
          dc1-server-1/consul:
            condition: ready
        ready_when:
          consul:
            members: ">=2"
          timeout: 60s
      mesh-gateway:
        run:
          - consul
          - connect
          - envoy
          - -gateway=mesh
          - -register
          - -service
          - mesh-gateway
          - -address
          - 10.1.0.100:8443
          - -bind-address
          - default=0.0.0.0:8443
          - -wan-address
          - 10.255.0.200:8443
          - -admin-bind
          - 127.0.0.1:19000
          - --
          - --log-level
          - info
        uses:
          - envoy
        env:
          CONSUL_GRPC_ADDR: 127.0.0.1:8502
          CONSUL_HTTP_ADDR: 127.0.0.1:8500
        depends_on:
          dc1-mesh/consul:
            condition: ready
        ready_when:
          http:
            url: http://127.0.0.1:19000/ready
          timeout: 90s
        restart: on-failure
    labels:
      dc: dc1
      name: mesh
      role: gateway
      group: mesh
  dc1-server-1:
    networks:
      dc1-lan:
        ip: 10.1.0.10
      wan:
        ip: 10.255.0.10
    files:
      config-entries.json: |
        [
          {
            "file": "${node_dir}/config-entry-0.json",
            "label": "consul.datacenters.dc1.config_entries[0] (line 27)"
          },
          {
            "file": "${node_dir}/gateway-entry-0.json",
            "label": "consul.peering (mesh entry for via_mesh_gateways)"
          }
        ]
      config-entry-0.json: |-
        {
          "Kind": "proxy-defaults",
          "MeshGateway": {
            "Mode": "local"
          },
          "Name": "global"
        }
      consul.json: |
        {
          "advertise_addr": "10.1.0.10",
          "bind_addr": "0.0.0.0",
          "bootstrap_expect": 1,
          "client_addr": "0.0.0.0",
          "connect": {
            "enabled": true
          },
          "data_dir": "${node_dir}/data",
          "datacenter": "dc1",
          "disable_update_check": true,
          "log_level": "INFO",
          "node_name": "server-1",
          "ports": {
            "grpc": 8502
          },
          "primary_datacenter": "dc1",
          "retry_interval": "1s",
          "retry_join": null,
          "serf_lan": "10.1.0.10",
          "serf_wan": "10.1.0.10",
          "server": true,
          "ui_config": {
            "enabled": true
          }
        }
      gateway-entry-0.json: |
        {
          "Kind": "mesh",
          "Peering": {
            "PeerThroughMeshGateways": true
          }
        }
    processes:
      config-entries:
        run:
          - ${parker}
          - config-entries
          - ${node_dir}/config-entries.json
        env:
          CONSUL_HTTP_ADDR: 127.0.0.1:8500
        depends_on:
          dc1-server-1/consul:
            condition: ready
        ready_when:
          log: "parker: config entries applied"
          timeout: 60s
      consul:
        run:
          - consul
          - agent
          - -config-file=${node_dir}/consul.json
        ready_when:
          consul:
            leader: true
          timeout: 90s
      peering-dc1-dc2:
        run:
          - sh
          - -c
          - |-
            if ! consul peering read -name dc1-dc2 >/dev/null 2>&1; then
              # The acceptor's gateway can lag its servers: until it routes to them the
              # exchange fails (tls: unrecognized name), so retry until ready_when's
              # timeout.
              until consul peering establish -name dc1-dc2 -peering-token "$(cat ${run_dir}/peering-dc1-dc2.token)"; do sleep 2; done
            fi
            until consul peering read -name dc1-dc2 | grep -q ACTIVE; do sleep 1; done
            echo "parker: peering dc1-dc2 active"
            exec sleep 2147483647
        uses:
          - consul
        env:
          CONSUL_HTTP_ADDR: 127.0.0.1:8500
        depends_on:
          dc1-mesh/mesh-gateway:
            condition: ready
          dc1-server-1/config-entries:
            condition: ready
          dc1-server-1/consul:
            condition: ready
          dc2-server-1/peering-dc1-dc2-token:
            condition: ready
        ready_when:
          log: "parker: peering dc1-dc2 active"
          timeout: 120s
        restart: on-failure
    labels:
      dc: dc1
      name: server-1
      role: server
  dc1-web:
    networks:
      dc1-lan:
        ip: 10.1.0.101
    files:
      consul.json: |
        {
          "advertise_addr": "10.1.0.101",
          "bind_addr": "10.1.0.101",
          "client_addr": "0.0.0.0",
          "data_dir": "${node_dir}/data",
          "datacenter": "dc1",
          "disable_update_check": true,
          "log_level": "INFO",
          "node_name": "web",
          "ports": {
            "grpc": 8502
          },
          "primary_datacenter": "dc1",
          "retry_interval": "1s",
          "retry_join": [
            "10.1.0.10"
          ],
          "server": false,
          "services": [
            {
              "check": {
                "http": "http://127.0.0.1:8080/health",
                "interval": "2s"
              },
              "connect": {
                "sidecar_service": {
                  "port": 21000,
                  "proxy": {
                    "upstreams": [
                      {
                        "destination_name": "api",
                        "destination_peer": "dc1-dc2",
                        "local_bind_port": 9091
                      }
                    ]
                  }
                }
              },
              "name": "web",
              "port": 8080
            }
          ]
        }
    processes:
      consul:
        run:
          - consul
          - agent
          - -config-file=${node_dir}/consul.json
        depends_on:
          dc1-server-1/consul:
            condition: ready
        ready_when:
          consul:
            members: ">=2"
          timeout: 60s
      web:
        run:
          - ${parker}
          - fake-service
          - --name
          - web
          - --port
          - "8080"
          - --dc
          - dc1
          - --control
          - ${node_dir}/web.fake.sock
        env:
          PARKER_FAKE: "{\"upstreams\":[\"http://127.0.0.1:9091/\"]}"
        depends_on:
          dc1-web/consul:
            condition: started
        ready_when:
          port: 8080
          http:
            url: http://127.0.0.1:8080/ready
            status: 200
          consul:
            service_healthy: web
          timeout: 60s
      web-sidecar:
        run:
          - consul
          - connect
          - envoy
          - -sidecar-for
          - web
          - -admin-bind
          - 127.0.0.1:19000
          - --
          - --log-level
          - info
        uses:
          - envoy
        env:
          CONSUL_GRPC_ADDR: 127.0.0.1:8502
          CONSUL_HTTP_ADDR: 127.0.0.1:8500
        depends_on:
          dc1-web/consul:
            condition: ready
        ready_when:
          http:
            url: http://127.0.0.1:19000/ready
          timeout: 60s
        restart: on-failure
    labels:
      dc: dc1
      name: web
      role: client
      group: web
      services:
        - web
  dc2-api:
    networks:
      dc2-lan:
        ip: 10.2.0.100
    files:
      consul.json: |
        {
          "advertise_addr": "10.2.0.100",
          "bind_addr": "10.2.0.100",
          "client_addr": "0.0.0.0",
          "data_dir": "${node_dir}/data",
          "datacenter": "dc2",
          "disable_update_check": true,
          "log_level": "INFO",
          "node_name": "api",
          "ports": {
            "grpc": 8502
          },
          "primary_datacenter": "dc2",
          "retry_interval": "1s",
          "retry_join": [
            "10.2.0.10"
          ],
          "server": false,
          "services": [
            {
              "check": {
                "http": "http://127.0.0.1:9090/health",
                "interval": "2s"
              },
              "connect": {
                "sidecar_service": {
                  "port": 21000,
                  "proxy": {}
                }
              },
              "name": "api",
              "port": 9090
            }
          ]
        }
    processes:
      api:
        run:
          - ${parker}
          - fake-service
          - --name
          - api
          - --port
          - "9090"
          - --dc
          - dc2
          - --control
          - ${node_dir}/api.fake.sock
        env:
          PARKER_FAKE: "{}"
        depends_on:
          dc2-api/consul:
            condition: started
        ready_when:
          port: 9090
          http:
            url: http://127.0.0.1:9090/ready
            status: 200
          consul:
            service_healthy: api
          timeout: 60s
      api-sidecar:
        run:
          - consul
          - connect
          - envoy
          - -sidecar-for
          - api
          - -admin-bind
          - 127.0.0.1:19000
          - --
          - --log-level
          - info
        uses:
          - envoy
        env:
          CONSUL_GRPC_ADDR: 127.0.0.1:8502
          CONSUL_HTTP_ADDR: 127.0.0.1:8500
        depends_on:
          dc2-api/consul:
            condition: ready
        ready_when:
          http:
            url: http://127.0.0.1:19000/ready
          timeout: 60s
        restart: on-failure
      consul:
        run:
          - consul
          - agent
          - -config-file=${node_dir}/consul.json
        depends_on:
          dc2-server-1/consul:
            condition: ready
        ready_when:
          consul:
            members: ">=2"
          timeout: 60s
    labels:
      dc: dc2
      name: api
      role: client
      group: api
      services:
        - api
  dc2-mesh:
    networks:
      dc2-lan:
        ip: 10.2.0.101
      wan:
        ip: 10.255.0.210
    files:
      consul.json: |
        {
          "advertise_addr": "10.2.0.101",
          "bind_addr": "10.2.0.101",
          "client_addr": "0.0.0.0",
          "data_dir": "${node_dir}/data",
          "datacenter": "dc2",
          "disable_update_check": true,
          "log_level": "INFO",
          "node_name": "mesh",
          "ports": {
            "grpc": 8502
          },
          "primary_datacenter": "dc2",
          "retry_interval": "1s",
          "retry_join": [
            "10.2.0.10"
          ],
          "server": false
        }
    processes:
      consul:
        run:
          - consul
          - agent
          - -config-file=${node_dir}/consul.json
        depends_on:
          dc2-server-1/consul:
            condition: ready
        ready_when:
          consul:
            members: ">=2"
          timeout: 60s
      mesh-gateway:
        run:
          - consul
          - connect
          - envoy
          - -gateway=mesh
          - -register
          - -service
          - mesh-gateway
          - -address
          - 10.2.0.101:8443
          - -bind-address
          - default=0.0.0.0:8443
          - -wan-address
          - 10.255.0.210:8443
          - -admin-bind
          - 127.0.0.1:19000
          - --
          - --log-level
          - info
        uses:
          - envoy
        env:
          CONSUL_GRPC_ADDR: 127.0.0.1:8502
          CONSUL_HTTP_ADDR: 127.0.0.1:8500
        depends_on:
          dc2-mesh/consul:
            condition: ready
        ready_when:
          http:
            url: http://127.0.0.1:19000/ready
          timeout: 90s
        restart: on-failure
    labels:
      dc: dc2
      name: mesh
      role: gateway
      group: mesh
  dc2-server-1:
    networks:
      dc2-lan:
        ip: 10.2.0.10
    files:
      config-entries.json: |
        [
          {
            "file": "${node_dir}/gateway-entry-0.json",
            "label": "consul.peering (mesh entry for via_mesh_gateways)"
          },
          {
            "file": "${node_dir}/gateway-entry-1.json",
            "label": "consul.peering exports (exported-services entry)"
          }
        ]
      consul.json: |
        {
          "advertise_addr": "10.2.0.10",
          "bind_addr": "10.2.0.10",
          "bootstrap_expect": 1,
          "client_addr": "0.0.0.0",
          "connect": {
            "enabled": true
          },
          "data_dir": "${node_dir}/data",
          "datacenter": "dc2",
          "disable_update_check": true,
          "log_level": "INFO",
          "node_name": "server-1",
          "ports": {
            "grpc": 8502
          },
          "primary_datacenter": "dc2",
          "retry_interval": "1s",
          "retry_join": null,
          "server": true,
          "ui_config": {
            "enabled": true
          }
        }
      gateway-entry-0.json: |
        {
          "Kind": "mesh",
          "Peering": {
            "PeerThroughMeshGateways": true
          }
        }
      gateway-entry-1.json: |
        {
          "Kind": "exported-services",
          "Name": "default",
          "Services": [
            {
              "Consumers": [
                {
                  "Peer": "dc1-dc2"
                }
              ],
              "Name": "api"
            }
          ]
        }
    processes:
      config-entries:
        run:
          - ${parker}
          - config-entries
          - ${node_dir}/config-entries.json
        env:
          CONSUL_HTTP_ADDR: 127.0.0.1:8500
        depends_on:
          dc2-server-1/consul:
            condition: ready
        ready_when:
          log: "parker: config entries applied"
          timeout: 60s
      consul:
        run:
          - consul
          - agent
          - -config-file=${node_dir}/consul.json
        ready_when:
          consul:
            leader: true
          timeout: 90s
      peering-dc1-dc2-token:
        run:
          - sh
          - -c
          - |-
            if ! { [ -s ${run_dir}/peering-dc1-dc2.token ] && consul peering read -name dc1-dc2 >/dev/null 2>&1; }; then
              consul peering generate-token -name dc1-dc2 > ${run_dir}/peering-dc1-dc2.token.tmp && mv ${run_dir}/peering-dc1-dc2.token.tmp ${run_dir}/peering-dc1-dc2.token || exit 1
            fi
            echo "parker: peering token ready"
            exec sleep 2147483647
        uses:
          - consul
        env:
          CONSUL_HTTP_ADDR: 127.0.0.1:8500
        depends_on:
          dc2-mesh/mesh-gateway:
            condition: ready
          dc2-server-1/config-entries:
            condition: ready
          dc2-server-1/consul:
            condition: ready
        ready_when:
          log: "parker: peering token ready"
          timeout: 90s
        restart: on-failure
    labels:
      dc: dc2
      name: server-1
      role: server
scenario:
  steps:
    - wait: dc1 ready
    - wait: dc2 ready
    - name: the peering is active
      assert:
        exec:
          "on": dc1/server-1
          run: consul peering read -name dc1-dc2
          output: ACTIVE
        within: 30s
    - name: dc1 sees api imported from dc2
      assert:
        exec:
          "on": dc1/server-1
          run: curl -sf http://127.0.0.1:8500/v1/health/service/api?peer=dc1-dc2
          output: "\"Service\":\"api\""
        within: 60s
    - name: web in dc1 reaches api in dc2 over the peering
      assert:
        exec:
          "on": dc1/web
          run: curl -sf -m 2 http://127.0.0.1:9091/
          output: api
        within: 90s
