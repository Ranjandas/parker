parker: v1alpha1
name: partitions
versions:
  consul: 1.22.7+ent
  envoy: 1.35.12
networks:
  dc1-lan:
    subnet: 10.1.0.0/24
    gateway: 10.1.0.1
    auto: true
nodes:
  dc1-frontend:
    networks:
      dc1-lan:
        ip: 10.1.0.103
    files:
      consul.json: |
        {
          "acl": {
            "default_policy": "deny",
            "enable_token_persistence": true,
            "enabled": true,
            "tokens": {
              "agent": "00000000-0000-4000-8000-000000000000"
            }
          },
          "advertise_addr": "10.1.0.103",
          "bind_addr": "10.1.0.103",
          "client_addr": "0.0.0.0",
          "data_dir": "${node_dir}/data",
          "datacenter": "dc1",
          "disable_update_check": true,
          "encrypt": "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=",
          "log_level": "INFO",
          "node_name": "frontend",
          "ports": {
            "grpc": 8502
          },
          "primary_datacenter": "dc1",
          "retry_interval": "1s",
          "retry_join": [
            "10.1.0.10",
            "10.1.0.11",
            "10.1.0.12"
          ],
          "server": false,
          "services": [
            {
              "check": {
                "http": "http://127.0.0.1:8080/health",
                "interval": "2s"
              },
              "connect": {
                "sidecar_service": {
                  "port": 21000,
                  "proxy": {
                    "upstreams": [
                      {
                        "destination_name": "billing",
                        "destination_namespace": "payments",
                        "destination_partition": "team-a",
                        "local_bind_port": 9091
                      }
                    ]
                  }
                }
              },
              "name": "frontend",
              "port": 8080,
              "token": "00000000-0000-4000-8000-000000000000"
            }
          ]
        }
    processes:
      consul:
        run:
          - consul
          - agent
          - -config-file=${node_dir}/consul.json
        depends_on:
          dc1-server-1/acl-setup:
            condition: ready
          dc1-server-1/consul:
            condition: ready
          dc1-server-1/tenancy:
            condition: ready
          dc1-server-2/consul:
            condition: ready
          dc1-server-3/consul:
            condition: ready
        ready_when:
          consul:
            members: ">=4"
            token: 00000000-0000-4000-8000-000000000000
          timeout: 60s
      frontend:
        run:
          - ${parker}
          - fake-service
          - --name
          - frontend
          - --port
          - "8080"
          - --dc
          - dc1
          - --control
          - ${node_dir}/frontend.fake.sock
        env:
          PARKER_FAKE: "{\"upstreams\":[\"http://127.0.0.1:9091/\"]}"
        depends_on:
          dc1-frontend/consul:
            condition: started
        ready_when:
          port: 8080
          http:
            url: http://127.0.0.1:8080/ready
            status: 200
          consul:
            service_healthy: frontend
            token: 00000000-0000-4000-8000-000000000000
          timeout: 60s
      frontend-sidecar:
        run:
          - consul
          - connect
          - envoy
          - -sidecar-for
          - frontend
          - -admin-bind
          - 127.0.0.1:19000
          - --
          - --log-level
          - info
        uses:
          - envoy
        env:
          CONSUL_GRPC_ADDR: 127.0.0.1:8502
          CONSUL_HTTP_ADDR: 127.0.0.1:8500
          CONSUL_HTTP_TOKEN: 00000000-0000-4000-8000-000000000000
        depends_on:
          dc1-frontend/consul:
            condition: ready
        ready_when:
          http:
            url: http://127.0.0.1:19000/ready
          timeout: 60s
        restart: on-failure
    labels:
      product: consul
      dc: dc1
      name: frontend
      role: client
      group: frontend
      services:
        - frontend
      partition: default
  dc1-mesh:
    networks:
      dc1-lan:
        ip: 10.1.0.104
    files:
      consul.json: |
        {
          "acl": {
            "default_policy": "deny",
            "enable_token_persistence": true,
            "enabled": true,
            "tokens": {
              "agent": "00000000-0000-4000-8000-000000000000"
            }
          },
          "advertise_addr": "10.1.0.104",
          "bind_addr": "10.1.0.104",
          "client_addr": "0.0.0.0",
          "data_dir": "${node_dir}/data",
          "datacenter": "dc1",
          "disable_update_check": true,
          "encrypt": "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=",
          "log_level": "INFO",
          "node_name": "mesh",
          "ports": {
            "grpc": 8502
          },
          "primary_datacenter": "dc1",
          "retry_interval": "1s",
          "retry_join": [
            "10.1.0.10",
            "10.1.0.11",
            "10.1.0.12"
          ],
          "server": false
        }
    processes:
      consul:
        run:
          - consul
          - agent
          - -config-file=${node_dir}/consul.json
        depends_on:
          dc1-server-1/acl-setup:
            condition: ready
          dc1-server-1/consul:
            condition: ready
          dc1-server-1/tenancy:
            condition: ready
          dc1-server-2/consul:
            condition: ready
          dc1-server-3/consul:
            condition: ready
        ready_when:
          consul:
            members: ">=4"
            token: 00000000-0000-4000-8000-000000000000
          timeout: 60s
      mesh-gateway:
        run:
          - consul
          - connect
          - envoy
          - -gateway=mesh
          - -register
          - -service
          - mesh-gateway
          - -address
          - 10.1.0.104:8443
          - -bind-address
          - default=0.0.0.0:8443
          - -admin-bind
          - 127.0.0.1:19000
          - --
          - --log-level
          - info
        uses:
          - envoy
        env:
          CONSUL_GRPC_ADDR: 127.0.0.1:8502
          CONSUL_HTTP_ADDR: 127.0.0.1:8500
          CONSUL_HTTP_TOKEN: 00000000-0000-4000-8000-000000000000
          CONSUL_NAMESPACE: default
        depends_on:
          dc1-mesh/consul:
            condition: ready
        ready_when:
          http:
            url: http://127.0.0.1:19000/ready
          timeout: 90s
        restart: on-failure
    labels:
      product: consul
      dc: dc1
      name: mesh
      role: gateway
      group: mesh
      partition: default
  dc1-server-1:
    networks:
      dc1-lan:
        ip: 10.1.0.10
    files:
      config-entries.json: |
        [
          {
            "file": "${node_dir}/config-entry-0.json",
