scenario:
  steps:
    - wait: dc1 ready
    - name: both partitions and their payments namespaces exist
      assert:
        exec:
          "on": dc1/server-1
          run: consul namespace list -partition team-a && consul namespace list -partition team-b
          output: payments
        within: 60s
    - name: billing runs in both partitions
      assert:
        exec:
          "on": dc1/server-1
          run: consul members -partition team-b
          output: billing
        within: 60s
    - name: frontend reaches team-a's billing through the mesh gateways
      assert:
        exec:
          "on": dc1/frontend
          run: curl -sf -m 2 http://127.0.0.1:9091/
          output: team-a-billing
        within: 90s
    - name: take team-a's billing down
      stop: dc1/team-a/billing
    - name: frontend fails over to team-b's billing
      assert:
        exec:
          "on": dc1/frontend
          run: curl -sf -m 2 http://127.0.0.1:9091/
          output: team-b-billing
        within: 90s
    - start: dc1/team-a/billing
    - name: and back to team-a's once it is healthy
      assert:
        exec:
          "on": dc1/frontend
          run: curl -sf -m 2 http://127.0.0.1:9091/
          output: team-a-billing
        within: 90s
