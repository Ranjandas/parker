          ],
          "server": false,
          "services": [
            {
              "check": {
                "http": "http://127.0.0.1:8080/health",
                "interval": "2s"
              },
              "connect": {
                "sidecar_service": {
                  "port": 21000,
                  "proxy": {
                    "upstreams": [
                      {
                        "destination_name": "billing",
                        "destination_namespace": "payments",
                        "destination_peer": "billing",
                        "local_bind_port": 9091
                      }
                    ]
                  }
                }
              },
              "name": "frontend",
              "port": 8080,
              "token": "00000000-0000-4000-8000-000000000000"
            }
          ]
        }
    processes:
      consul:
        run:
          - consul
          - agent
          - -config-file=${node_dir}/consul.json
        depends_on:
          dc1-server-1/acl-setup:
            condition: ready
          dc1-server-1/consul:
            condition: ready
          dc1-server-1/tenancy:
            condition: ready
        ready_when:
          consul:
            members: ">=2"
            token: 00000000-0000-4000-8000-000000000000
          timeout: 60s
      frontend:
        run:
          - ${parker}
          - fake-service
          - --name
          - frontend
          - --port
          - "8080"
          - --dc
          - dc1
          - --control
          - ${node_dir}/frontend.fake.sock
        env:
          PARKER_FAKE: "{\"upstreams\":[\"http://127.0.0.1:9091/\"]}"
        depends_on:
          dc1-team-a-frontend/consul:
            condition: started
        ready_when:
          port: 8080
          http:
            url: http://127.0.0.1:8080/ready
            status: 200
          consul:
            service_healthy: frontend
            partition: team-a
            token: 00000000-0000-4000-8000-000000000000
          timeout: 60s
      frontend-sidecar:
        run:
          - consul
          - connect
          - envoy
          - -sidecar-for
          - frontend
          - -admin-bind
          - 127.0.0.1:19000
          - --
          - --log-level
          - info
        uses:
          - envoy
        env:
          CONSUL_GRPC_ADDR: 127.0.0.1:8502
          CONSUL_HTTP_ADDR: 127.0.0.1:8500
          CONSUL_HTTP_TOKEN: 00000000-0000-4000-8000-000000000000
          CONSUL_PARTITION: team-a
        depends_on:
          dc1-team-a-frontend/consul:
            condition: ready
        ready_when:
          http:
            url: http://127.0.0.1:19000/ready
          timeout: 60s
        restart: on-failure
    labels:
      dc: dc1
      name: frontend
      role: client
      group: frontend
      services:
        - frontend
      partition: team-a
  dc1-team-a-mesh:
    networks:
