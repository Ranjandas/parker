      partition: team-b
scenario:
  steps:
    - wait: dc1 ready
    - wait: dc2 ready
    - name: the peering is active on both sides
      assert:
        exec:
          "on": dc1/server-1
          run: consul peering read -partition team-a -name billing
          output: ACTIVE
        within: 60s
    - assert:
        exec:
          "on": dc2/server-1
          run: consul peering read -partition team-b -name billing
          output: ACTIVE
        within: 30s
    - name: team-a sees billing imported from dc2's team-b
      assert:
        exec:
          "on": dc1/server-1
          run: "curl -sf -H \"X-Consul-Token: $CONSUL_HTTP_TOKEN\" 'http://127.0.0.1:8500/v1/health/service/billing?peer=billing&partition=team-a&ns=payments'"
          output: "\"Service\":\"billing\""
        within: 60s
    - name: frontend in dc1/team-a reaches billing in dc2/team-b over the peering
      assert:
        exec:
          "on": dc1/team-a/frontend
          run: curl -sf -m 2 http://127.0.0.1:9091/
          output: billing
        within: 90s
