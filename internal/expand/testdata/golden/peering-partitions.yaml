parker: v1alpha1
name: peering-partitions
versions:
  consul: 1.22.7+ent
  envoy: 1.35.12
networks:
  dc1-lan:
    subnet: 10.1.0.0/24
    gateway: 10.1.0.1
    auto: true
  dc2-lan:
    subnet: 10.2.0.0/24
    gateway: 10.2.0.1
    auto: true
  wan:
    subnet: 10.255.0.0/24
    gateway: 10.255.0.1
    auto: true
nodes:
  dc1-mesh:
    networks:
      dc1-lan:
        ip: 10.1.0.101
      wan:
        ip: 10.255.0.200
    files:
      consul.json: |
        {
          "acl": {
            "default_policy": "deny",
            "enable_token_persistence": true,
            "enabled": true,
            "tokens": {
              "agent": "00000000-0000-4000-8000-000000000000"
            }
          },
          "advertise_addr": "10.1.0.101",
          "bind_addr": "10.1.0.101",
          "client_addr": "0.0.0.0",
          "data_dir": "${node_dir}/data",
          "datacenter": "dc1",
          "disable_update_check": true,
          "encrypt": "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=",
          "log_level": "INFO",
          "node_name": "mesh",
          "ports": {
            "grpc": 8502
          },
          "primary_datacenter": "dc1",
          "retry_interval": "1s",
          "retry_join": [
            "10.1.0.10"
          ],
          "server": false
        }
    processes:
      consul:
        run:
          - consul
          - agent
          - -config-file=${node_dir}/consul.json
        depends_on:
          dc1-server-1/acl-setup:
            condition: ready
          dc1-server-1/consul:
            condition: ready
          dc1-server-1/tenancy:
            condition: ready
        ready_when:
          consul:
            members: ">=2"
            token: 00000000-0000-4000-8000-000000000000
          timeout: 60s
      mesh-gateway:
        run:
          - consul
          - connect
          - envoy
          - -gateway=mesh
          - -register
          - -service
          - mesh-gateway
          - -address
          - 10.1.0.101:8443
          - -bind-address
          - default=0.0.0.0:8443
          - -wan-address
          - 10.255.0.200:8443
          - -admin-bind
          - 127.0.0.1:19000
          - --
          - --log-level
          - info
        uses:
          - envoy
        env:
          CONSUL_GRPC_ADDR: 127.0.0.1:8502
          CONSUL_HTTP_ADDR: 127.0.0.1:8500
          CONSUL_HTTP_TOKEN: 00000000-0000-4000-8000-000000000000
          CONSUL_NAMESPACE: default
        depends_on:
          dc1-mesh/consul:
            condition: ready
        ready_when:
          http:
            url: http://127.0.0.1:19000/ready
          timeout: 90s
        restart: on-failure
    labels:
      dc: dc1
      name: mesh
      role: gateway
      group: mesh
      partition: default
  dc1-server-1:
    networks:
      dc1-lan:
        ip: 10.1.0.10
      wan:
        ip: 10.255.0.10
    files:
      config-entries.json: |
        [
          {
            "file": "${node_dir}/config-entry-0.json",
            "label": "consul.datacenters.dc1.partitions.team-a.config_entries[0] (line 43)",
            "partition": "team-a"
          },
          {
            "file": "${node_dir}/gateway-entry-0.json",
            "label": "consul.peering (mesh entry for via_mesh_gateways)"
          }
        ]
      config-entry-0.json: |-
        {
          "Kind": "proxy-defaults",
          "MeshGateway": {
            "Mode": "local"
          },
          "Name": "global"
        }
      consul.json: |
        {
          "acl": {
            "default_policy": "deny",
            "enable_token_persistence": true,
            "enabled": true,
            "tokens": {
              "agent": "00000000-0000-4000-8000-000000000000",
              "initial_management": "00000000-0000-4000-8000-000000000000"
            }
          },
          "advertise_addr": "10.1.0.10",
          "bind_addr": "0.0.0.0",
          "bootstrap_expect": 1,
          "client_addr": "0.0.0.0",
          "connect": {
            "enabled": true
          },
          "data_dir": "${node_dir}/data",
          "datacenter": "dc1",
          "disable_update_check": true,
          "encrypt": "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=",
          "log_level": "INFO",
          "node_name": "server-1",
          "ports": {
            "grpc": 8502
          },
          "primary_datacenter": "dc1",
          "retry_interval": "1s",
          "retry_join": null,
          "serf_lan": "10.1.0.10",
          "serf_wan": "10.1.0.10",
          "server": true,
          "ui_config": {
            "enabled": true
          }
        }
      gateway-entry-0.json: |
        {
          "Kind": "mesh",
          "Peering": {
            "PeerThroughMeshGateways": true
          }
        }
      tenancy.json: |
        {
          "partitions": [
            "team-a"
          ],
          "policies": [
            {
              "name": "parker-read-everywhere",
              "partition": "team-a",
              "rules": "namespace_prefix \"\" {\n  service_prefix \"\" { policy = \"read\" }\n  node_prefix \"\" { policy = \"read\" }\n}\n"
            },
            {
              "name": "parker-mesh-gateway-mesh-gateway",
              "rules": "mesh = \"write\"\npeering = \"read\"\nservice \"mesh-gateway\" { policy = \"write\" }\nservice_prefix \"\" { policy = \"read\" }\nnode_prefix \"\" { policy = \"read\" }\nagent_prefix \"\" { policy = \"read\" }\npartition_prefix \"\" {\n  peering = \"read\"\n  namespace_prefix \"\" {\n    service_prefix \"\" { policy = \"read\" }\n    node_prefix \"\" { policy = \"read\" }\n  }\n}\nnamespace_prefix \"\" {\n  service_prefix \"\" { policy = \"read\" }\n  node_prefix \"\" { policy = \"read\" }\n}\n"
            },
            {
              "name": "parker-mesh-gateway-mesh-gateway",
              "partition": "team-a",
              "rules": "mesh = \"write\"\npeering = \"read\"\nservice \"mesh-gateway\" { policy = \"write\" }\nservice_prefix \"\" { policy = \"read\" }\nnode_prefix \"\" { policy = \"read\" }\nagent_prefix \"\" { policy = \"read\" }\nnamespace_prefix \"\" {\n  service_prefix \"\" { policy = \"read\" }\n  node_prefix \"\" { policy = \"read\" }\n}\n"
            }
          ],
          "tokens": [
            {
              "secret_id": "00000000-0000-4000-8000-000000000000",
              "description": "Parker service frontend",
              "partition": "team-a",
              "service": "frontend",
              "policies": [
                "parker-read-everywhere"
              ]
            },
            {
              "secret_id": "00000000-0000-4000-8000-000000000000",
              "description": "Parker agent frontend",
              "partition": "team-a",
              "node": "frontend",
              "datacenter": "dc1"
            },
            {
              "secret_id": "00000000-0000-4000-8000-000000000000",
              "description": "Parker mesh gateway mesh-gateway",
              "service": "mesh-gateway",
              "policies": [
                "parker-mesh-gateway-mesh-gateway"
              ]
            },
            {
              "secret_id": "00000000-0000-4000-8000-000000000000",
              "description": "Parker agent mesh",
              "node": "mesh",
              "datacenter": "dc1"
            },
            {
              "secret_id": "00000000-0000-4000-8000-000000000000",
              "description": "Parker mesh gateway mesh-gateway",
              "partition": "team-a",
              "service": "mesh-gateway",
              "policies": [
                "parker-mesh-gateway-mesh-gateway"
              ]
            },
            {
              "secret_id": "00000000-0000-4000-8000-000000000000",
              "description": "Parker agent mesh",
              "partition": "team-a",
              "node": "mesh",
              "datacenter": "dc1"
            }
          ]
        }
    processes:
      acl-setup:
        run:
          - ${parker}
          - acl-setup
          - --agent-token
          - 00000000-0000-4000-8000-000000000000
          - --enterprise
        env:
          CONSUL_HTTP_ADDR: 127.0.0.1:8500
          CONSUL_HTTP_TOKEN: 00000000-0000-4000-8000-000000000000
        depends_on:
          dc1-server-1/consul:
            condition: ready
        ready_when:
          log: "parker: ACLs set up"
          timeout: 60s
      config-entries:
        run:
          - ${parker}
          - config-entries
          - ${node_dir}/config-entries.json
        env:
          CONSUL_HTTP_ADDR: 127.0.0.1:8500
          CONSUL_HTTP_TOKEN: 00000000-0000-4000-8000-000000000000
        depends_on:
          dc1-server-1/acl-setup:
            condition: ready
          dc1-server-1/consul:
            condition: ready
          dc1-server-1/tenancy:
            condition: ready
        ready_when:
          log: "parker: config entries applied"
          timeout: 60s
      consul:
        run:
          - consul
          - agent
          - -config-file=${node_dir}/consul.json
        ready_when:
          consul:
            leader: true
            token: 00000000-0000-4000-8000-000000000000
          timeout: 90s
      peering-billing:
        run:
          - sh
          - -c
          - |-
            if ! consul peering read -name billing >/dev/null 2>&1; then
              # The acceptor's gateway can lag its servers: until it routes to them the
              # exchange fails (tls: unrecognized name), so retry until ready_when's
              # timeout.
              until consul peering establish -name billing -peering-token "$(cat ${run_dir}/peering-billing.token)"; do sleep 2; done
            fi
            until consul peering read -name billing | grep -q ACTIVE; do sleep 1; done
            echo "parker: peering billing active"
            exec sleep 2147483647
        uses:
          - consul
        env:
          CONSUL_HTTP_ADDR: 127.0.0.1:8500
          CONSUL_HTTP_TOKEN: 00000000-0000-4000-8000-000000000000
          CONSUL_PARTITION: team-a
        depends_on:
          dc1-mesh/mesh-gateway:
            condition: ready
          dc1-server-1/acl-setup:
            condition: ready
          dc1-server-1/config-entries:
            condition: ready
          dc1-server-1/consul:
            condition: ready
          dc1-server-1/tenancy:
            condition: ready
          dc2-server-1/peering-billing-token:
            condition: ready
        ready_when:
          log: "parker: peering billing active"
          timeout: 120s
        restart: on-failure
      tenancy:
        run:
          - ${parker}
          - tenancy
          - ${node_dir}/tenancy.json
        env:
          CONSUL_HTTP_ADDR: 127.0.0.1:8500
          CONSUL_HTTP_TOKEN: 00000000-0000-4000-8000-000000000000
        depends_on:
          dc1-server-1/acl-setup:
            condition: ready
          dc1-server-1/consul:
            condition: ready
        ready_when:
          log: "parker: partitions and namespaces ready"
          timeout: 60s
    labels:
      dc: dc1
      name: server-1
      role: server
  dc1-team-a-frontend:
    networks:
      dc1-lan:
        ip: 10.1.0.100
    files:
      consul.json: |
        {
          "acl": {
