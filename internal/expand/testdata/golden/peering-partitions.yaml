                  "port": 21000,
                  "proxy": {}
                }
              },
              "name": "billing",
              "namespace": "payments",
              "port": 9000,
              "token": "00000000-0000-4000-8000-000000000000"
            }
          ]
        }
    processes:
      billing:
        run:
          - ${parker}
          - fake-service
          - --name
          - billing
          - --port
          - "9000"
          - --dc
          - dc2
          - --control
          - ${node_dir}/billing.fake.sock
        env:
          PARKER_FAKE: "{}"
        depends_on:
          dc2-team-b-billing/consul:
            condition: started
        ready_when:
          port: 9000
          http:
            url: http://127.0.0.1:9000/ready
            status: 200
          consul:
            service_healthy: billing
            partition: team-b
            namespace: payments
            token: 00000000-0000-4000-8000-000000000000
          timeout: 60s
      billing-sidecar:
        run:
          - consul
          - connect
          - envoy
          - -sidecar-for
          - billing
          - -admin-bind
          - 127.0.0.1:19000
          - --
          - --log-level
          - info
        uses:
          - envoy
        env:
          CONSUL_GRPC_ADDR: 127.0.0.1:8502
          CONSUL_HTTP_ADDR: 127.0.0.1:8500
          CONSUL_HTTP_TOKEN: 00000000-0000-4000-8000-000000000000
          CONSUL_NAMESPACE: payments
          CONSUL_PARTITION: team-b
        depends_on:
          dc2-team-b-billing/consul:
            condition: ready
        ready_when:
          http:
            url: http://127.0.0.1:19000/ready
          timeout: 60s
        restart: on-failure
      consul:
        run:
          - consul
          - agent
          - -config-file=${node_dir}/consul.json
        depends_on:
          dc2-server-1/acl-setup:
            condition: ready
          dc2-server-1/consul:
            condition: ready
          dc2-server-1/tenancy:
            condition: ready
        ready_when:
          consul:
            members: ">=2"
            token: 00000000-0000-4000-8000-000000000000
          timeout: 60s
    labels:
      dc: dc2
      name: billing
      role: client
      group: billing
      services:
        - billing
      partition: team-b
      namespaces:
        - payments
  dc2-team-b-mesh:
    networks:
      dc2-lan:
        ip: 10.2.0.102
