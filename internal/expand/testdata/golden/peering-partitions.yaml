              "rules": "namespace_prefix \"\" {\n  service_prefix \"\" { policy = \"read\" }\n  node_prefix \"\" { policy = \"read\" }\n}\n"
            }
          ],
          "tokens": [
            {
              "secret_id": "00000000-0000-4000-8000-000000000000",
              "description": "Parker service billing",
              "partition": "team-b",
              "namespace": "payments",
              "service": "billing"
            },
            {
              "secret_id": "00000000-0000-4000-8000-000000000000",
              "description": "Parker agent billing",
              "partition": "team-b",
              "node": "billing",
              "datacenter": "dc2"
            },
            {
              "secret_id": "00000000-0000-4000-8000-000000000000",
              "description": "Parker mesh gateway mesh-gateway",
              "service": "mesh-gateway",
              "policies": [
                "parker-mesh-gateway-mesh-gateway"
              ]
            },
            {
              "secret_id": "00000000-0000-4000-8000-000000000000",
              "description": "Parker agent mesh",
              "node": "mesh",
              "datacenter": "dc2"
            },
            {
              "secret_id": "00000000-0000-4000-8000-000000000000",
              "description": "Parker mesh gateway mesh-gateway",
              "partition": "team-b",
              "service": "mesh-gateway",
              "policies": [
                "parker-mesh-gateway-mesh-gateway"
              ]
            },
            {
              "secret_id": "00000000-0000-4000-8000-000000000000",
              "description": "Parker agent mesh",
              "partition": "team-b",
              "node": "mesh",
              "datacenter": "dc2"
            }
          ]
        }
    processes:
      acl-setup:
        run:
          - ${parker}
          - acl-setup
          - --agent-token
          - 00000000-0000-4000-8000-000000000000
          - --enterprise
        env:
          CONSUL_HTTP_ADDR: 127.0.0.1:8500
          CONSUL_HTTP_TOKEN: 00000000-0000-4000-8000-000000000000
        depends_on:
          dc2-server-1/consul:
            condition: ready
        ready_when:
          log: "parker: ACLs set up"
          timeout: 60s
      config-entries:
        run:
          - ${parker}
          - config-entries
          - ${node_dir}/config-entries.json
        env:
          CONSUL_HTTP_ADDR: 127.0.0.1:8500
          CONSUL_HTTP_TOKEN: 00000000-0000-4000-8000-000000000000
        depends_on:
          dc2-server-1/acl-setup:
            condition: ready
          dc2-server-1/consul:
            condition: ready
          dc2-server-1/tenancy:
            condition: ready
        ready_when:
          log: "parker: config entries applied"
          timeout: 60s
      consul:
        run:
          - consul
          - agent
          - -config-file=${node_dir}/consul.json
        ready_when:
          consul:
            leader: true
            token: 00000000-0000-4000-8000-000000000000
          timeout: 90s
      peering-billing-token:
        run:
          - sh
          - -c
          - |-
            if ! { [ -s ${run_dir}/peering-billing.token ] && consul peering read -name billing >/dev/null 2>&1; }; then
              consul peering generate-token -name billing > ${run_dir}/peering-billing.token.tmp && mv ${run_dir}/peering-billing.token.tmp ${run_dir}/peering-billing.token || exit 1
            fi
            echo "parker: peering token ready"
            exec sleep 2147483647
        uses:
          - consul
        env:
          CONSUL_HTTP_ADDR: 127.0.0.1:8500
          CONSUL_HTTP_TOKEN: 00000000-0000-4000-8000-000000000000
          CONSUL_PARTITION: team-b
        depends_on:
          dc2-mesh/mesh-gateway:
            condition: ready
          dc2-server-1/acl-setup:
            condition: ready
          dc2-server-1/config-entries:
            condition: ready
          dc2-server-1/consul:
            condition: ready
          dc2-server-1/tenancy:
            condition: ready
        ready_when:
          log: "parker: peering token ready"
          timeout: 90s
        restart: on-failure
      tenancy:
        run:
          - ${parker}
          - tenancy
          - ${node_dir}/tenancy.json
        env:
          CONSUL_HTTP_ADDR: 127.0.0.1:8500
          CONSUL_HTTP_TOKEN: 00000000-0000-4000-8000-000000000000
        depends_on:
          dc2-server-1/acl-setup:
            condition: ready
          dc2-server-1/consul:
            condition: ready
        ready_when:
          log: "parker: partitions and namespaces ready"
          timeout: 60s
    labels:
      dc: dc2
      name: server-1
      role: server
  dc2-team-b-billing:
    networks:
      dc2-lan:
