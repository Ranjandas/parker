parker: v1alpha1
name: gateways
versions:
  consul: 1.22.7
  envoy: 1.35.12
networks:
  dc1-lan:
    subnet: 10.1.0.0/24
    gateway: 10.1.0.1
    auto: true
nodes:
  dc1-api:
    networks:
      dc1-lan:
        ip: 10.1.0.100
    files:
      consul.json: |
        {
          "advertise_addr": "10.1.0.100",
          "bind_addr": "10.1.0.100",
          "client_addr": "0.0.0.0",
          "data_dir": "${node_dir}/data",
          "datacenter": "dc1",
          "disable_update_check": true,
          "log_level": "INFO",
          "node_name": "api",
          "ports": {
            "grpc": 8502
          },
          "primary_datacenter": "dc1",
          "retry_interval": "1s",
          "retry_join": [
            "10.1.0.10"
          ],
          "server": false,
          "services": [
            {
              "check": {
                "http": "http://127.0.0.1:9090/health",
                "interval": "2s"
              },
              "connect": {
                "sidecar_service": {
                  "port": 21000,
                  "proxy": {}
                }
              },
              "name": "api",
              "port": 9090
            }
          ]
        }
    processes:
      api:
        run:
          - ${parker}
          - fake-service
          - --name
          - api
          - --port
          - "9090"
          - --dc
          - dc1
          - --control
          - ${node_dir}/api.fake.sock
        env:
          PARKER_FAKE: "{}"
        depends_on:
          dc1-api/consul:
            condition: started
        ready_when:
          port: 9090
          http:
            url: http://127.0.0.1:9090/ready
            status: 200
          consul:
            service_healthy: api
          timeout: 60s
      api-sidecar:
        run:
          - consul
          - connect
          - envoy
          - -sidecar-for
          - api
          - -admin-bind
          - 127.0.0.1:19000
          - --
          - --log-level
          - info
        uses:
          - envoy
        env:
          CONSUL_GRPC_ADDR: 127.0.0.1:8502
          CONSUL_HTTP_ADDR: 127.0.0.1:8500
        depends_on:
          dc1-api/consul:
            condition: ready
        ready_when:
          http:
            url: http://127.0.0.1:19000/ready
          timeout: 60s
        restart: on-failure
      consul:
        run:
          - consul
          - agent
          - -config-file=${node_dir}/consul.json
        depends_on:
          dc1-server-1/consul:
            condition: ready
        ready_when:
          consul:
            members: ">=2"
          timeout: 60s
    labels:
      product: consul
      dc: dc1
      name: api
      role: client
      group: api
      services:
        - api
  dc1-edge:
    networks:
      dc1-lan:
        ip: 10.1.0.101
    files:
      consul.json: |
        {
          "advertise_addr": "10.1.0.101",
          "bind_addr": "10.1.0.101",
          "client_addr": "0.0.0.0",
          "data_dir": "${node_dir}/data",
          "datacenter": "dc1",
          "disable_update_check": true,
          "log_level": "INFO",
          "node_name": "edge",
          "ports": {
            "grpc": 8502
          },
          "primary_datacenter": "dc1",
          "retry_interval": "1s",
          "retry_join": [
            "10.1.0.10"
          ],
          "server": false
        }
    processes:
      api-gateway:
        run:
          - consul
          - connect
          - envoy
          - -gateway=api
          - -register
          - -service
          - edge
          - -address
          - 10.1.0.101:8443
          - -admin-bind
          - 127.0.0.1:19000
          - --
          - --log-level
          - info
        uses:
          - envoy
        env:
          CONSUL_GRPC_ADDR: 127.0.0.1:8502
          CONSUL_HTTP_ADDR: 127.0.0.1:8500
        depends_on:
          dc1-edge/consul:
            condition: ready
        ready_when:
          http:
            url: http://127.0.0.1:19000/ready
          timeout: 90s
        restart: on-failure
      consul:
        run:
          - consul
          - agent
          - -config-file=${node_dir}/consul.json
        depends_on:
          dc1-server-1/consul:
            condition: ready
        ready_when:
          consul:
            members: ">=2"
          timeout: 60s
    labels:
      product: consul
      dc: dc1
      name: edge
      role: gateway
      group: edge
  dc1-ingress:
    networks:
      dc1-lan:
        ip: 10.1.0.102
    files:
      consul.json: |
        {
          "advertise_addr": "10.1.0.102",
          "bind_addr": "10.1.0.102",
          "client_addr": "0.0.0.0",
          "data_dir": "${node_dir}/data",
          "datacenter": "dc1",
          "disable_update_check": true,
          "log_level": "INFO",
          "node_name": "ingress",
          "ports": {
            "grpc": 8502
          },
          "primary_datacenter": "dc1",
          "retry_interval": "1s",
          "retry_join": [
            "10.1.0.10"
          ],
          "server": false
        }
    processes:
      consul:
        run:
          - consul
          - agent
          - -config-file=${node_dir}/consul.json
        depends_on:
          dc1-server-1/consul:
            condition: ready
        ready_when:
          consul:
            members: ">=2"
          timeout: 60s
      ingress-gateway:
        run:
          - consul
          - connect
          - envoy
          - -gateway=ingress
          - -register
          - -service
          - ingress-gateway
          - -address
          - 10.1.0.102:8443
          - -admin-bind
          - 127.0.0.1:19000
          - --
          - --log-level
          - info
        uses:
          - envoy
        env:
          CONSUL_GRPC_ADDR: 127.0.0.1:8502
          CONSUL_HTTP_ADDR: 127.0.0.1:8500
        depends_on:
          dc1-ingress/consul:
            condition: ready
        ready_when:
          http:
            url: http://127.0.0.1:19000/ready
          timeout: 90s
        restart: on-failure
    labels:
      product: consul
      dc: dc1
      name: ingress
      role: gateway
      group: ingress
  dc1-legacy:
    networks:
      dc1-lan:
        ip: 10.1.0.103
    files:
      consul.json: |
        {
          "advertise_addr": "10.1.0.103",
          "bind_addr": "10.1.0.103",
          "client_addr": "0.0.0.0",
          "data_dir": "${node_dir}/data",
          "datacenter": "dc1",
          "disable_update_check": true,
          "log_level": "INFO",
          "node_name": "legacy",
          "primary_datacenter": "dc1",
          "retry_interval": "1s",
          "retry_join": [
            "10.1.0.10"
          ],
          "server": false,
          "services": [
            {
              "check": {
                "http": "http://127.0.0.1:7070/health",
                "interval": "2s"
              },
              "name": "legacy",
              "port": 7070
            }
          ]
        }
    processes:
      consul:
        run:
          - consul
          - agent
          - -config-file=${node_dir}/consul.json
        depends_on:
          dc1-server-1/consul:
            condition: ready
        ready_when:
          consul:
            members: ">=2"
          timeout: 60s
      legacy:
        run:
          - ${parker}
          - fake-service
          - --name
          - legacy
          - --port
          - "7070"
          - --dc
          - dc1
          - --control
          - ${node_dir}/legacy.fake.sock
        env:
          PARKER_FAKE: "{}"
        depends_on:
          dc1-legacy/consul:
            condition: started
        ready_when:
          port: 7070
          http:
            url: http://127.0.0.1:7070/ready
            status: 200
          consul:
            service_healthy: legacy
          timeout: 60s
    labels:
      product: consul
      dc: dc1
      name: legacy
      role: client
      group: legacy
      services:
        - legacy
  dc1-server-1:
    networks:
      dc1-lan:
        ip: 10.1.0.10
    files:
      config-entries.json: |
        [
          {
            "file": "${node_dir}/config-entry-0.json",
            "label": "consul.datacenters.dc1.config_entries[0] (line 40)"
          },
          {
            "file": "${node_dir}/config-entry-1.json",
            "label": "consul.datacenters.dc1.config_entries[1] (line 43)"
          },
          {
            "file": "${node_dir}/gateway-entry-0.json",
            "label": "consul.datacenters.dc1.gateways.edge.entry"
          },
          {
            "file": "${node_dir}/gateway-entry-1.json",
            "label": "consul.datacenters.dc1.gateways.ingress.entry"
          },
          {
            "file": "${node_dir}/gateway-entry-2.json",
            "label": "consul.datacenters.dc1.gateways.terminating.entry"
          }
        ]
      config-entry-0.json: |-
        {
          "Kind": "service-defaults",
          "Name": "api",
          "Protocol": "http"
        }
      config-entry-1.json: |-
        {
          "Kind": "http-route",
          "Name": "edge-to-api",
          "Parents": [
            {
              "Kind": "api-gateway",
              "Name": "edge",
              "SectionName": "http"
            }
          ],
          "Rules": [
            {
              "Services": [
                {
                  "Name": "api"
                }
              ]
            }
          ]
        }
      consul.json: |
        {
          "advertise_addr": "10.1.0.10",
          "bind_addr": "10.1.0.10",
          "bootstrap_expect": 1,
          "client_addr": "0.0.0.0",
          "connect": {
            "enabled": true
          },
          "data_dir": "${node_dir}/data",
          "datacenter": "dc1",
          "disable_update_check": true,
          "log_level": "INFO",
          "node_name": "server-1",
          "primary_datacenter": "dc1",
          "retry_interval": "1s",
          "retry_join": null,
          "server": true,
          "ui_config": {
            "enabled": true
          }
        }
      gateway-entry-0.json: |
        {
          "Kind": "api-gateway",
          "Listeners": [
            {
              "Name": "http",
              "Port": 8081,
              "Protocol": "http"
            }
          ],
          "Name": "edge"
        }
      gateway-entry-1.json: |
        {
          "Kind": "ingress-gateway",
          "Listeners": [
            {
              "Port": 8080,
              "Protocol": "http",
              "Services": [
                {
                  "Hosts": [
                    "*"
                  ],
                  "Name": "api"
                }
              ]
            }
          ],
          "Name": "ingress-gateway"
        }
      gateway-entry-2.json: |
        {
          "Kind": "terminating-gateway",
          "Name": "terminating-gateway",
          "Services": [
            {
              "Name": "legacy"
            }
          ]
        }
    processes:
      config-entries:
        run:
          - ${parker}
          - config-entries
          - ${node_dir}/config-entries.json
        env:
          CONSUL_HTTP_ADDR: 127.0.0.1:8500
        depends_on:
          dc1-server-1/consul:
            condition: ready
        ready_when:
          log: "parker: config entries applied"
          timeout: 60s
      consul:
        run:
          - consul
          - agent
          - -config-file=${node_dir}/consul.json
        ready_when:
          consul:
            leader: true
          timeout: 90s
    labels:
      product: consul
      dc: dc1
      name: server-1
      role: server
  dc1-terminating:
    networks:
      dc1-lan:
        ip: 10.1.0.104
    files:
      consul.json: |
        {
          "advertise_addr": "10.1.0.104",
          "bind_addr": "10.1.0.104",
          "client_addr": "0.0.0.0",
          "data_dir": "${node_dir}/data",
          "datacenter": "dc1",
          "disable_update_check": true,
          "log_level": "INFO",
          "node_name": "terminating",
          "ports": {
            "grpc": 8502
          },
          "primary_datacenter": "dc1",
          "retry_interval": "1s",
          "retry_join": [
            "10.1.0.10"
          ],
          "server": false
        }
    processes:
      consul:
        run:
          - consul
          - agent
          - -config-file=${node_dir}/consul.json
        depends_on:
          dc1-server-1/consul:
            condition: ready
        ready_when:
          consul:
            members: ">=2"
          timeout: 60s
      terminating-gateway:
        run:
          - consul
          - connect
          - envoy
          - -gateway=terminating
          - -register
          - -service
          - terminating-gateway
          - -address
          - 10.1.0.104:8443
          - -admin-bind
          - 127.0.0.1:19000
          - --
          - --log-level
          - info
        uses:
          - envoy
        env:
          CONSUL_GRPC_ADDR: 127.0.0.1:8502
          CONSUL_HTTP_ADDR: 127.0.0.1:8500
        depends_on:
          dc1-terminating/consul:
            condition: ready
        ready_when:
          http:
            url: http://127.0.0.1:19000/ready
          timeout: 90s
        restart: on-failure
    labels:
      product: consul
      dc: dc1
      name: terminating
      role: gateway
      group: terminating
  dc1-web:
    networks:
      dc1-lan:
        ip: 10.1.0.105
    files:
      consul.json: |
        {
          "advertise_addr": "10.1.0.105",
          "bind_addr": "10.1.0.105",
          "client_addr": "0.0.0.0",
          "data_dir": "${node_dir}/data",
          "datacenter": "dc1",
          "disable_update_check": true,
          "log_level": "INFO",
          "node_name": "web",
          "ports": {
            "grpc": 8502
          },
          "primary_datacenter": "dc1",
          "retry_interval": "1s",
          "retry_join": [
            "10.1.0.10"
          ],
          "server": false,
          "services": [
            {
              "check": {
                "http": "http://127.0.0.1:8080/health",
                "interval": "2s"
              },
              "connect": {
                "sidecar_service": {
                  "port": 21000,
                  "proxy": {
                    "upstreams": [
                      {
                        "destination_name": "legacy",
                        "local_bind_port": 9092
                      }
                    ]
                  }
                }
              },
              "name": "web",
              "port": 8080
            }
          ]
        }
    processes:
      consul:
        run:
          - consul
          - agent
          - -config-file=${node_dir}/consul.json
        depends_on:
          dc1-server-1/consul:
            condition: ready
        ready_when:
          consul:
            members: ">=2"
          timeout: 60s
      web:
        run:
          - ${parker}
          - fake-service
          - --name
          - web
          - --port
          - "8080"
          - --dc
          - dc1
          - --control
          - ${node_dir}/web.fake.sock
        env:
          PARKER_FAKE: "{\"upstreams\":[\"http://127.0.0.1:9092/\"]}"
        depends_on:
          dc1-web/consul:
            condition: started
        ready_when:
          port: 8080
          http:
            url: http://127.0.0.1:8080/ready
            status: 200
          consul:
            service_healthy: web
          timeout: 60s
      web-sidecar:
        run:
          - consul
          - connect
          - envoy
          - -sidecar-for
          - web
          - -admin-bind
          - 127.0.0.1:19000
          - --
          - --log-level
          - info
        uses:
          - envoy
        env:
          CONSUL_GRPC_ADDR: 127.0.0.1:8502
          CONSUL_HTTP_ADDR: 127.0.0.1:8500
        depends_on:
          dc1-web/consul:
            condition: ready
        ready_when:
          http:
            url: http://127.0.0.1:19000/ready
          timeout: 60s
        restart: on-failure
    labels:
      product: consul
      dc: dc1
      name: web
      role: client
      group: web
      services:
        - web
scenario:
  steps:
    - wait: dc1 ready
    - assert:
        consul:
          service_healthy: api-sidecar-proxy
        within: 60s
    - name: the ingress gateway reaches api
      assert:
        exec:
          "on": dc1/ingress
          run: curl -sf -m 2 http://$PARKER_IP:8080/
          output: api
        within: 60s
    - name: the API gateway routes to api
      assert:
        exec:
          "on": dc1/edge
          run: curl -sf -m 2 http://$PARKER_IP:8081/
          output: api
        within: 60s
    - name: web reaches legacy through the terminating gateway
      assert:
        exec:
          "on": dc1/web
          run: curl -sf -m 2 http://127.0.0.1:9092/
          output: legacy
        within: 60s
