parker: v1alpha1
name: config-entries
versions:
  consul: 1.22.7
networks:
  dc1-lan:
    subnet: 10.1.0.0/24
    gateway: 10.1.0.1
    auto: true
nodes:
  dc1-server-1:
    networks:
      dc1-lan:
        ip: 10.1.0.10
    files:
      config-entries.json: |
        [
          {
            "file": "${node_dir}/config-entry-0.json",
            "label": "consul.datacenters.dc1.config_entries[0] (line 11)"
          },
          {
            "file": "${node_dir}/config-entry-1.json",
            "label": "consul.datacenters.dc1.config_entries[1] (line 15)"
          },
          {
            "file": "${node_dir}/config-entry-2.hcl",
            "label": "consul.datacenters.dc1.config_entries[2] (line 18, ../../examples/entries/web-intentions.hcl)"
          }
        ]
      config-entry-0.json: |-
        {
          "Config": {
            "protocol": "http"
          },
          "Kind": "proxy-defaults",
          "Name": "global"
        }
      config-entry-1.json: |-
        {
          "Kind": "service-defaults",
          "Name": "web",
          "Protocol": "http"
        }
      config-entry-2.hcl: |
        Kind = "service-intentions"
        Name = "web"
        Sources = [
          {
            Name   = "api"
            Action = "allow"
          },
          {
            Name   = "*"
            Action = "deny"
          },
        ]
      consul.json: |
        {
          "advertise_addr": "10.1.0.10",
          "bind_addr": "10.1.0.10",
          "bootstrap_expect": 1,
          "client_addr": "0.0.0.0",
          "data_dir": "${node_dir}/data",
          "datacenter": "dc1",
          "disable_update_check": true,
          "log_level": "INFO",
          "node_name": "server-1",
          "primary_datacenter": "dc1",
          "retry_interval": "1s",
          "retry_join": null,
          "server": true,
          "ui_config": {
            "enabled": true
          }
        }
    processes:
      config-entries:
        run:
          - ${parker}
          - config-entries
          - ${node_dir}/config-entries.json
        env:
          CONSUL_HTTP_ADDR: 127.0.0.1:8500
        depends_on:
          dc1-server-1/consul:
            condition: ready
        ready_when:
          log: "parker: config entries applied"
          timeout: 60s
      consul:
        run:
          - consul
          - agent
          - -config-file=${node_dir}/consul.json
        ready_when:
          consul:
            leader: true
          timeout: 90s
    labels:
      dc: dc1
      name: server-1
      role: server
  dc1-web:
    networks:
      dc1-lan:
        ip: 10.1.0.100
    files:
      consul.json: |
        {
          "advertise_addr": "10.1.0.100",
          "bind_addr": "10.1.0.100",
          "client_addr": "0.0.0.0",
          "data_dir": "${node_dir}/data",
          "datacenter": "dc1",
          "disable_update_check": true,
          "log_level": "INFO",
          "node_name": "web",
          "primary_datacenter": "dc1",
          "retry_interval": "1s",
          "retry_join": [
            "10.1.0.10"
          ],
          "server": false,
          "services": [
            {
              "check": {
                "http": "http://127.0.0.1:8080/health",
                "interval": "2s"
              },
              "name": "web",
              "port": 8080
            }
          ]
        }
    processes:
      consul:
        run:
          - consul
          - agent
          - -config-file=${node_dir}/consul.json
        depends_on:
          dc1-server-1/consul:
            condition: ready
        ready_when:
          consul:
            members: ">=2"
          timeout: 60s
      web:
        run:
          - ${parker}
          - fake-service
          - --name
          - web
          - --port
          - "8080"
          - --dc
          - dc1
          - --control
          - ${node_dir}/web.fake.sock
        env:
          PARKER_FAKE: "{}"
        depends_on:
          dc1-web/consul:
            condition: started
        ready_when:
          port: 8080
          http:
            url: http://127.0.0.1:8080/ready
            status: 200
          consul:
            service_healthy: web
          timeout: 60s
    labels:
      dc: dc1
      name: web
      role: client
      group: web
      services:
        - web
