parker: v1alpha1
name: vault-consul-secrets
versions:
  consul: 1.22.7
  vault: 1.21.1
networks:
  dc1-lan:
    subnet: 10.1.0.0/24
    gateway: 10.1.0.1
    auto: true
  east-lan:
    subnet: 10.64.0.0/24
    gateway: 10.64.0.1
    auto: true
nodes:
  dc1-server-1:
    networks:
      dc1-lan:
        ip: 10.1.0.10
    files:
      consul.json: |
        {
          "acl": {
            "default_policy": "deny",
            "enable_token_persistence": true,
            "enabled": true,
            "tokens": {
              "agent": "00000000-0000-4000-8000-000000000000",
              "initial_management": "00000000-0000-4000-8000-000000000000"
            }
          },
          "advertise_addr": "10.1.0.10",
          "bind_addr": "10.1.0.10",
          "bootstrap_expect": 1,
          "client_addr": "0.0.0.0",
          "data_dir": "${node_dir}/data",
          "datacenter": "dc1",
          "disable_update_check": true,
          "encrypt": "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=",
          "log_level": "INFO",
          "node_name": "server-1",
          "primary_datacenter": "dc1",
          "retry_interval": "1s",
          "retry_join": null,
          "server": true,
          "ui_config": {
            "enabled": true
          }
        }
      tenancy.json: |
        {}
    processes:
      acl-setup:
        run:
          - ${parker}
          - acl-setup
          - --agent-token
          - 00000000-0000-4000-8000-000000000000
        env:
          CONSUL_HTTP_ADDR: 127.0.0.1:8500
          CONSUL_HTTP_TOKEN: 00000000-0000-4000-8000-000000000000
        depends_on:
          dc1-server-1/consul:
            condition: ready
        ready_when:
          log: "parker: ACLs set up"
          timeout: 60s
      consul:
        run:
          - consul
          - agent
          - -config-file=${node_dir}/consul.json
        ready_when:
          consul:
            leader: true
            token: 00000000-0000-4000-8000-000000000000
          timeout: 90s
      tenancy:
        run:
          - ${parker}
          - tenancy
          - ${node_dir}/tenancy.json
        env:
          CONSUL_HTTP_ADDR: 127.0.0.1:8500
          CONSUL_HTTP_TOKEN: 00000000-0000-4000-8000-000000000000
        depends_on:
          dc1-server-1/acl-setup:
            condition: ready
          dc1-server-1/consul:
            condition: ready
        ready_when:
          log: "parker: partitions and namespaces ready"
          timeout: 60s
    labels:
      product: consul
      dc: dc1
      name: server-1
      role: server
  east-vault-1:
    networks:
      dc1-lan:
        ip: 10.1.0.200
      east-lan:
        ip: 10.64.0.10
    files:
      data/.keep: ""
      vault-init.json: |
        {
          "addrs": [
            "http://10.64.0.10:8200"
          ],
          "root_token": "00000000-0000-4000-8000-000000000000",
          "keys_file": "${node_dir}/vault-keys.json",
          "consul_engine": {
            "path": "consul/",
            "address": "10.1.0.10:8500",
            "scheme": "http",
            "token": "00000000-0000-4000-8000-000000000000",
            "role": "management",
            "policy": "global-management",
            "policy_field": "consul_policies"
          }
        }
      vault.json: |
        {
          "api_addr": "http://10.64.0.10:8200",
          "cluster_addr": "https://10.64.0.10:8201",
          "disable_mlock": true,
          "listener": {
            "tcp": {
              "address": "0.0.0.0:8200",
              "cluster_address": "10.64.0.10:8201",
              "tls_disable": true
            }
          },
          "storage": {
            "raft": {
              "node_id": "vault-1",
              "path": "${node_dir}/data"
            }
          },
          "ui": true
        }
    processes:
      vault:
        run:
          - vault
          - server
          - -config=${node_dir}/vault.json
        ready_when:
          http:
            url: http://127.0.0.1:8200/v1/sys/health?standbyok=true&perfstandbyok=true&sealedcode=200&uninitcode=200
          timeout: 90s
      vault-init:
        run:
          - ${parker}
          - vault-init
          - ${node_dir}/vault-init.json
        depends_on:
          dc1-server-1/consul:
            condition: ready
          east-vault-1/vault:
            condition: started
        ready_when:
          log: "parker: vault initialised and unsealed"
          timeout: 90s
    labels:
      product: vault
      dc: east
      name: vault-1
      role: server
      group: vault
scenario:
  steps:
    - wait: east ready
    - assert:
        exec:
          "on": east/vault-1
          run: vault read consul/creds/management
          output: consul_namespace
        within: 30s
    - assert:
        exec:
          "on": east/vault-1
          run: CONSUL_HTTP_TOKEN=$(vault read -field=token consul/creds/management) consul members -http-addr=$(vault read -field=address consul/config/access)
          output: server-1
        within: 30s
