            condition: ready
          dc1-server-1/consul:
            condition: ready
          dc1-server-1/tenancy:
            condition: ready
          dc1-server-2/consul:
            condition: ready
          dc1-server-3/consul:
            condition: ready
        ready_when:
          log: "parker: config entries applied"
          timeout: 60s
      consul:
        run:
          - consul
          - agent
          - -config-file=${node_dir}/consul.json
        ready_when:
          consul:
            leader: true
            token: 00000000-0000-4000-8000-000000000000
            ca_file: ca.pem
          timeout: 90s
      dataplane-health:
        run:
          - ${parker}
          - dataplane-health
          - ${node_dir}/dataplane.json
          - --servers
          - 10.1.0.10,10.1.0.11,10.1.0.12
        env:
          CONSUL_CACERT: ${node_dir}/ca.pem
          CONSUL_HTTP_ADDR: https://127.0.0.1:8501
          CONSUL_HTTP_TOKEN: 00000000-0000-4000-8000-000000000000
        depends_on:
          dc1-server-1/acl-setup:
            condition: ready
          dc1-server-1/consul:
            condition: ready
          dc1-server-1/tenancy:
            condition: ready
          dc1-server-2/consul:
            condition: ready
          dc1-server-3/consul:
            condition: ready
        ready_when:
          log: "parker: dataplane services registered"
          timeout: 60s
        restart: on-failure
      peering-dc1-dc2:
        run:
          - sh
          - -c
          - |-
            if ! consul peering read -name dc1-dc2 >/dev/null 2>&1; then
              # The acceptor's gateway can lag its servers: until it routes to them the
              # exchange fails (tls: unrecognized name), so retry until ready_when's
              # timeout.
              until consul peering establish -name dc1-dc2 -peering-token "$(cat ${run_dir}/peering-dc1-dc2.token)"; do sleep 2; done
            fi
            until consul peering read -name dc1-dc2 | grep -q ACTIVE; do sleep 1; done
            echo "parker: peering dc1-dc2 active"
            exec sleep 2147483647
        uses:
          - consul
        env:
          CONSUL_CACERT: ${node_dir}/ca.pem
          CONSUL_HTTP_ADDR: https://127.0.0.1:8501
          CONSUL_HTTP_TOKEN: 00000000-0000-4000-8000-000000000000
        depends_on:
          dc1-server-1/acl-setup:
            condition: ready
          dc1-server-1/config-entries:
            condition: ready
          dc1-server-1/consul:
            condition: ready
          dc1-server-1/tenancy:
            condition: ready
          dc1-server-2/consul:
            condition: ready
          dc1-server-3/consul:
            condition: ready
          dc2-server-1/peering-dc1-dc2-token:
            condition: ready
        ready_when:
          log: "parker: peering dc1-dc2 active"
          timeout: 120s
        restart: on-failure
      tenancy:
        run:
          - ${parker}
          - tenancy
          - ${node_dir}/tenancy.json
        env:
          CONSUL_CACERT: ${node_dir}/ca.pem
          CONSUL_HTTP_ADDR: https://127.0.0.1:8501
          CONSUL_HTTP_TOKEN: 00000000-0000-4000-8000-000000000000
        depends_on:
          dc1-server-1/acl-setup:
            condition: ready
          dc1-server-1/consul:
            condition: ready
          dc1-server-2/consul:
            condition: ready
          dc1-server-3/consul:
            condition: ready
        ready_when:
          log: "parker: partitions and namespaces ready"
          timeout: 60s
