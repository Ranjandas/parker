          dc2-server-1/consul:
            condition: ready
          dc2-server-1/tenancy:
            condition: ready
          dc2-server-2/consul:
            condition: ready
          dc2-server-3/consul:
            condition: ready
        ready_when:
          consul:
            members: ">=4"
            token: 00000000-0000-4000-8000-000000000000
            ca_file: ca.pem
          timeout: 60s
      terminating-gateway:
        run:
          - consul
          - connect
          - envoy
          - -gateway=terminating
          - -register
          - -service
          - terminating-gateway
          - -address
          - 10.2.0.101:8443
          - -admin-bind
          - 127.0.0.1:19000
          - --
          - --log-level
          - info
        uses:
          - envoy
        env:
          CONSUL_CACERT: ${node_dir}/ca.pem
          CONSUL_GRPC_ADDR: https://127.0.0.1:8503
          CONSUL_HTTP_ADDR: https://127.0.0.1:8501
          CONSUL_HTTP_TOKEN: 00000000-0000-4000-8000-000000000000
        depends_on:
          dc2-terminating/consul:
            condition: ready
        ready_when:
          http:
            url: http://127.0.0.1:19000/ready
          timeout: 90s
        restart: on-failure
    labels:
      dc: dc2
      name: terminating
      role: gateway
      group: terminating
scenario:
  steps:
    - wait: dc1 ready
    - wait: dc2 ready
    - name: the peering is active
      assert:
        exec:
          "on": dc1/server-1
          run: consul peering read -name dc1-dc2
          output: ACTIVE
        within: 60s
    - name: api is registered on an external node in dc1
      assert:
        exec:
          "on": dc1/server-1
          run: consul catalog nodes -node-meta external-node=true
          output: api
        within: 30s
    - name: web reaches api through dc1's terminating gateway
      assert:
        exec:
          "on": dc1/web
          run: curl -sf -m 2 http://127.0.0.1:9091/
          output: "\"from\":\"10.1.0."
        within: 90s
    - name: dc1 sees api imported from dc2
      assert:
        exec:
          "on": dc1/server-1
          run: "curl -sf --cacert \"$CONSUL_CACERT\" -H \"X-Consul-Token: $CONSUL_HTTP_TOKEN\" \"$CONSUL_HTTP_ADDR/v1/health/service/api?peer=dc1-dc2\""
          output: "\"Service\":\"api\""
        within: 60s
    - name: dc1's terminating gateway goes down
      stop: dc1/terminating
    - name: web fails over to api through dc2's terminating gateway
      assert:
        exec:
          "on": dc1/web
          run: curl -sf -m 2 http://127.0.0.1:9091/
          output: "\"from\":\"10.2.0."
        within: 90s
    - name: dc1's terminating gateway comes back
      start: dc1/terminating
    - name: web is back on dc1's terminating gateway
      assert:
        exec:
          "on": dc1/web
          run: curl -sf -m 2 http://127.0.0.1:9091/
          output: "\"from\":\"10.1.0."
        within: 90s
