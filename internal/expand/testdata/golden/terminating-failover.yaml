parker: v1alpha1
name: tgw-failover
versions:
  consul: 2.1.0
  envoy: 1.39.1
networks:
  dc1-lan:
    subnet: 10.1.0.0/24
    gateway: 10.1.0.1
  dc2-lan:
    subnet: 10.2.0.0/24
    gateway: 10.2.0.1
  wan:
    subnet: 10.255.0.0/24
    gateway: 10.255.0.1
    auto: true
nodes:
  api:
    networks:
      dc1-lan:
        ip: 10.1.0.254
      dc2-lan:
        ip: 10.2.0.254
    processes:
      api:
        run:
          - ${parker}
          - fake-service
          - --name
          - api
          - --port
          - "9000"
          - --dc
          - ""
          - --control
          - ${node_dir}/api.fake.sock
        env:
          PARKER_FAKE: "{\"facts\":false}"
        ready_when:
          port: 9000
          http:
            url: http://127.0.0.1:9000/ready
            status: 200
          timeout: 60s
    labels:
      name: api
      role: external
      group: api
      services:
        - api
  dc1-mesh:
    networks:
      dc1-lan:
        ip: 10.1.0.100
      wan:
        ip: 10.255.0.200
    files:
      ca.pem: |
        <generated CERTIFICATE>
      consul.json: |
        {
          "acl": {
            "default_policy": "deny",
            "enable_token_persistence": true,
            "enabled": true,
            "tokens": {
              "agent": "00000000-0000-4000-8000-000000000000"
            }
          },
          "advertise_addr": "10.1.0.100",
          "auto_encrypt": {
            "tls": true
          },
          "bind_addr": "10.1.0.100",
          "client_addr": "0.0.0.0",
          "data_dir": "${node_dir}/data",
          "datacenter": "dc1",
          "disable_update_check": true,
          "encrypt": "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=",
          "log_level": "INFO",
          "node_name": "mesh",
          "ports": {
            "grpc_tls": 8503,
            "http": -1,
            "https": 8501
          },
          "primary_datacenter": "dc1",
          "retry_interval": "1s",
          "retry_join": [
            "10.1.0.10",
            "10.1.0.11",
            "10.1.0.12"
          ],
          "server": false,
          "tls": {
            "defaults": {
              "ca_file": "${node_dir}/ca.pem",
              "verify_outgoing": true
            },
            "internal_rpc": {
              "verify_server_hostname": true
            }
          }
        }
    processes:
      consul:
        run:
          - consul
          - agent
          - -config-file=${node_dir}/consul.json
        depends_on:
          dc1-server-1/acl-setup:
            condition: ready
          dc1-server-1/consul:
            condition: ready
          dc1-server-1/tenancy:
            condition: ready
          dc1-server-2/consul:
            condition: ready
          dc1-server-3/consul:
            condition: ready
        ready_when:
          consul:
            members: ">=4"
            token: 00000000-0000-4000-8000-000000000000
            ca_file: ca.pem
          timeout: 60s
      mesh-gateway:
        run:
          - consul
          - connect
          - envoy
          - -gateway=mesh
          - -register
          - -service
          - mesh-gateway
          - -address
          - 10.1.0.100:8443
          - -bind-address
          - default=0.0.0.0:8443
          - -wan-address
          - 10.255.0.200:8443
          - -admin-bind
          - 127.0.0.1:19000
          - --
          - --log-level
          - info
        uses:
          - envoy
        env:
          CONSUL_CACERT: ${node_dir}/ca.pem
          CONSUL_GRPC_ADDR: https://127.0.0.1:8503
          CONSUL_HTTP_ADDR: https://127.0.0.1:8501
          CONSUL_HTTP_TOKEN: 00000000-0000-4000-8000-000000000000
        depends_on:
          dc1-mesh/consul:
            condition: ready
        ready_when:
          http:
            url: http://127.0.0.1:19000/ready
          timeout: 90s
        restart: on-failure
    labels:
      dc: dc1
      name: mesh
      role: gateway
      group: mesh
  dc1-server-1:
    networks:
      dc1-lan:
        ip: 10.1.0.10
      wan:
        ip: 10.255.0.10
    files:
      ca.pem: |
        <generated CERTIFICATE>
      config-entries.json: |
        [
          {
            "file": "${node_dir}/config-entry-0.json",
            "label": "consul.datacenters.dc1.config_entries[0] (line 44)"
          },
          {
            "file": "${node_dir}/config-entry-1.json",
            "label": "consul.datacenters.dc1.config_entries[1] (line 47)"
          },
          {
            "file": "${node_dir}/config-entry-2.json",
            "label": "consul.datacenters.dc1.config_entries[2] (line 52)"
          },
          {
            "file": "${node_dir}/gateway-entry-0.json",
            "label": "consul.datacenters.dc1.gateways.terminating.entry"
          }
        ]
      config-entry-0.json: |-
        {
          "Kind": "proxy-defaults",
          "MeshGateway": {
            "Mode": "local"
          },
          "Name": "global"
        }
      config-entry-1.json: |-
        {
          "ConnectTimeout": "2s",
          "Failover": {
            "*": {
              "Targets": [
                {
                  "Peer": "dc1-dc2"
                }
              ]
            }
          },
          "Kind": "service-resolver",
          "Name": "api"
        }
      config-entry-2.json: |-
        {
          "Kind": "service-intentions",
          "Name": "api",
          "Sources": [
            {
              "Action": "allow",
              "Name": "web"
            }
          ]
        }
      consul.json: |
        {
          "acl": {
            "default_policy": "deny",
            "enable_token_persistence": true,
            "enabled": true,
            "tokens": {
              "agent": "00000000-0000-4000-8000-000000000000",
              "initial_management": "00000000-0000-4000-8000-000000000000"
            }
          },
          "advertise_addr": "10.1.0.10",
          "auto_encrypt": {
            "allow_tls": true
          },
          "bind_addr": "0.0.0.0",
          "bootstrap_expect": 3,
          "client_addr": "0.0.0.0",
          "connect": {
            "ca_config": {
              "private_key": "<generated EC PRIVATE KEY>\n",
              "root_cert": "<generated CERTIFICATE>\n"
            },
            "ca_provider": "consul",
            "enabled": true
          },
          "data_dir": "${node_dir}/data",
          "datacenter": "dc1",
          "disable_update_check": true,
          "encrypt": "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=",
          "log_level": "INFO",
          "node_name": "server-1",
          "ports": {
            "grpc_tls": 8503,
            "http": -1,
            "https": 8501
          },
          "primary_datacenter": "dc1",
          "retry_interval": "1s",
          "retry_join": [
            "10.1.0.11",
            "10.1.0.12"
          ],
          "serf_lan": "10.1.0.10",
          "serf_wan": "10.1.0.10",
          "server": true,
          "tls": {
            "defaults": {
              "ca_file": "${node_dir}/ca.pem",
              "cert_file": "${node_dir}/server.pem",
              "key_file": "${node_dir}/server-key.pem",
              "verify_incoming": true,
              "verify_outgoing": true
            },
            "https": {
              "verify_incoming": false
            },
            "internal_rpc": {
              "verify_server_hostname": true
            }
          },
          "ui_config": {
            "enabled": true
          }
        }
      dataplane.json: |
        [
          {
            "node": "api",
            "address": "10.1.0.254",
            "datacenter": "dc1",
            "node_meta": {
              "external-node": "true",
              "external-probe": "true"
            },
            "service": {
              "id": "api",
              "name": "api",
              "port": 9000,
              "address": "10.1.0.254"
            },
            "probe": "http://10.1.0.254:9000/health"
          }
        ]
      gateway-entry-0.json: |
        {
          "Kind": "terminating-gateway",
          "Name": "terminating-gateway",
          "Services": [
            {
              "Name": "api"
            }
          ]
        }
      server-key.pem: |
        <generated EC PRIVATE KEY>
      server.pem: |
        <generated CERTIFICATE>
      tenancy.json: |
        {
          "policies": [
            {
              "name": "parker-mesh-gateway-mesh-gateway",
              "rules": "mesh = \"write\"\npeering = \"read\"\nservice \"mesh-gateway\" { policy = \"write\" }\nservice_prefix \"\" { policy = \"read\" }\nnode_prefix \"\" { policy = \"read\" }\nagent_prefix \"\" { policy = \"read\" }\n"
            },
            {
              "name": "parker-terminating-gateway-terminating-gateway",
              "rules": "service \"api\" { policy = \"write\" }\n"
            }
          ],
          "tokens": [
            {
              "secret_id": "00000000-0000-4000-8000-000000000000",
              "description": "Parker mesh gateway mesh-gateway",
              "service": "mesh-gateway",
              "policies": [
                "parker-mesh-gateway-mesh-gateway"
              ]
            },
            {
              "secret_id": "00000000-0000-4000-8000-000000000000",
              "description": "Parker agent mesh",
              "node": "mesh",
              "datacenter": "dc1"
            },
            {
              "secret_id": "00000000-0000-4000-8000-000000000000",
              "description": "Parker terminating gateway terminating-gateway",
              "service": "terminating-gateway",
              "policies": [
                "parker-terminating-gateway-terminating-gateway"
              ]
            },
            {
              "secret_id": "00000000-0000-4000-8000-000000000000",
              "description": "Parker agent terminating",
              "node": "terminating",
              "datacenter": "dc1"
            },
            {
              "secret_id": "00000000-0000-4000-8000-000000000000",
              "description": "Parker service web",
              "service": "web"
            },
            {
              "secret_id": "00000000-0000-4000-8000-000000000000",
              "description": "Parker agent web",
              "node": "web",
              "datacenter": "dc1"
            }
          ]
        }
    processes:
      acl-setup:
        run:
          - ${parker}
          - acl-setup
          - --agent-token
          - 00000000-0000-4000-8000-000000000000
        env:
          CONSUL_CACERT: ${node_dir}/ca.pem
          CONSUL_HTTP_ADDR: https://127.0.0.1:8501
          CONSUL_HTTP_TOKEN: 00000000-0000-4000-8000-000000000000
        depends_on:
          dc1-server-1/consul:
            condition: ready
          dc1-server-2/consul:
            condition: ready
          dc1-server-3/consul:
            condition: ready
        ready_when:
          log: "parker: ACLs set up"
          timeout: 60s
      config-entries:
        run:
          - ${parker}
          - config-entries
          - ${node_dir}/config-entries.json
