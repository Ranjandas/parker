parker: v1alpha1
name: scenario
versions:
  consul: 1.22.7
networks:
  dc1-lan:
    subnet: 10.1.0.0/24
    gateway: 10.1.0.1
    auto: true
nodes:
  dc1-server-1:
    networks:
      dc1-lan:
        ip: 10.1.0.10
    files:
      consul.json: |
        {
          "advertise_addr": "10.1.0.10",
          "bind_addr": "10.1.0.10",
          "bootstrap_expect": 3,
          "client_addr": "0.0.0.0",
          "data_dir": "${node_dir}/data",
          "datacenter": "dc1",
          "disable_update_check": true,
          "log_level": "INFO",
          "node_name": "server-1",
          "primary_datacenter": "dc1",
          "retry_interval": "1s",
          "retry_join": [
            "10.1.0.11",
            "10.1.0.12"
          ],
          "server": true,
          "ui_config": {
            "enabled": true
          }
        }
    processes:
      consul:
        run:
          - consul
          - agent
          - -config-file=${node_dir}/consul.json
        ready_when:
          consul:
            leader: true
          timeout: 90s
    labels:
      product: consul
      dc: dc1
      name: server-1
      role: server
  dc1-server-2:
    networks:
      dc1-lan:
        ip: 10.1.0.11
    files:
      consul.json: |
        {
          "advertise_addr": "10.1.0.11",
          "bind_addr": "10.1.0.11",
          "bootstrap_expect": 3,
          "client_addr": "0.0.0.0",
          "data_dir": "${node_dir}/data",
          "datacenter": "dc1",
          "disable_update_check": true,
          "log_level": "INFO",
          "node_name": "server-2",
          "primary_datacenter": "dc1",
          "retry_interval": "1s",
          "retry_join": [
            "10.1.0.10",
            "10.1.0.12"
          ],
          "server": true,
          "ui_config": {
            "enabled": false
          }
        }
    processes:
      consul:
        run:
          - consul
          - agent
          - -config-file=${node_dir}/consul.json
        ready_when:
          consul:
            leader: true
          timeout: 90s
    labels:
      product: consul
      dc: dc1
      name: server-2
      role: server
  dc1-server-3:
    networks:
      dc1-lan:
        ip: 10.1.0.12
    files:
      consul.json: |
        {
          "advertise_addr": "10.1.0.12",
          "bind_addr": "10.1.0.12",
          "bootstrap_expect": 3,
          "client_addr": "0.0.0.0",
          "data_dir": "${node_dir}/data",
          "datacenter": "dc1",
          "disable_update_check": true,
          "log_level": "INFO",
          "node_name": "server-3",
          "primary_datacenter": "dc1",
          "retry_interval": "1s",
          "retry_join": [
            "10.1.0.10",
            "10.1.0.11"
          ],
          "server": true,
          "ui_config": {
            "enabled": false
          }
        }
    processes:
      consul:
        run:
          - consul
          - agent
          - -config-file=${node_dir}/consul.json
        ready_when:
          consul:
            leader: true
          timeout: 90s
    labels:
      product: consul
      dc: dc1
      name: server-3
      role: server
  dc1-web-1:
    networks:
      dc1-lan:
        ip: 10.1.0.100
    files:
      consul.json: |
        {
          "advertise_addr": "10.1.0.100",
          "bind_addr": "10.1.0.100",
          "client_addr": "0.0.0.0",
          "data_dir": "${node_dir}/data",
          "datacenter": "dc1",
          "disable_update_check": true,
          "log_level": "INFO",
          "node_name": "web-1",
          "primary_datacenter": "dc1",
          "retry_interval": "1s",
          "retry_join": [
            "10.1.0.10",
            "10.1.0.11",
            "10.1.0.12"
          ],
          "server": false,
          "services": [
            {
              "check": {
                "http": "http://127.0.0.1:8080/health",
                "interval": "2s"
              },
              "name": "web",
              "port": 8080
            }
          ]
        }
    processes:
      consul:
        run:
          - consul
          - agent
          - -config-file=${node_dir}/consul.json
        depends_on:
          dc1-server-1/consul:
            condition: ready
          dc1-server-2/consul:
            condition: ready
          dc1-server-3/consul:
            condition: ready
        ready_when:
          consul:
            members: ">=4"
          timeout: 60s
      web:
        run:
          - ${parker}
          - fake-service
          - --name
          - web
          - --port
          - "8080"
          - --dc
          - dc1
          - --control
          - ${node_dir}/web.fake.sock
        env:
          PARKER_FAKE: "{}"
        depends_on:
          dc1-web-1/consul:
            condition: started
        ready_when:
          port: 8080
          http:
            url: http://127.0.0.1:8080/ready
            status: 200
          consul:
            service_healthy: web
          timeout: 60s
    labels:
      product: consul
      dc: dc1
      name: web-1
      role: client
      group: web
      services:
        - web
  dc1-web-2:
    networks:
      dc1-lan:
        ip: 10.1.0.101
    files:
      consul.json: |
        {
          "advertise_addr": "10.1.0.101",
          "bind_addr": "10.1.0.101",
          "client_addr": "0.0.0.0",
          "data_dir": "${node_dir}/data",
          "datacenter": "dc1",
          "disable_update_check": true,
          "log_level": "INFO",
          "node_name": "web-2",
          "primary_datacenter": "dc1",
          "retry_interval": "1s",
          "retry_join": [
            "10.1.0.10",
            "10.1.0.11",
            "10.1.0.12"
          ],
          "server": false,
          "services": [
            {
              "check": {
                "http": "http://127.0.0.1:8080/health",
                "interval": "2s"
              },
              "name": "web",
              "port": 8080
            }
          ]
        }
    processes:
      consul:
        run:
          - consul
          - agent
          - -config-file=${node_dir}/consul.json
        depends_on:
          dc1-server-1/consul:
            condition: ready
          dc1-server-2/consul:
            condition: ready
          dc1-server-3/consul:
            condition: ready
        ready_when:
          consul:
            members: ">=4"
          timeout: 60s
      web:
        run:
          - ${parker}
          - fake-service
          - --name
          - web
          - --port
          - "8080"
          - --dc
          - dc1
          - --control
          - ${node_dir}/web.fake.sock
        env:
          PARKER_FAKE: "{}"
        depends_on:
          dc1-web-2/consul:
            condition: started
        ready_when:
          port: 8080
          http:
            url: http://127.0.0.1:8080/ready
            status: 200
          consul:
            service_healthy: web
          timeout: 60s
    labels:
      product: consul
      dc: dc1
      name: web-2
      role: client
      group: web
      services:
        - web
scenario:
  steps:
    - wait: dc1 ready
    - exec:
        "on": dc1/leader
        run: consul operator raft list-peers
    - assert:
        consul:
          leader: true
          members: ">=5"
          peers: ">=3"
        within: 10s
    - at: +2s
      assert:
        exec:
          "on": dc1/web
          run: curl -sf http://127.0.0.1:8080/
          output: web
        within: 10s
    - assert:
        consul:
          service_healthy: web
    - snapshot: logs
scenarios:
  wrong-peers:
    steps:
      - assert:
          consul:
            peers: ">=5"
          within: 2s
