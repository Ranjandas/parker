# Built in the Parker lab builder.
# Bring it up with: parker up peering-acl.yaml
parker: v1alpha1
name: peering-acl
versions: { consul: 2.1.0, envoy: 1.39.1 }
consul:
  defaults:
    acl: true
    service_template: { run: fake-service, connect: sidecar }
  peering:
    dc1-dc2:
      acceptor: dc2
      dialer: dc1
      via_mesh_gateways: true
      exports: { dc2: [api] }
  datacenters:
    dc1:
      servers: 1
      gateways: { mesh: true }
      nodes:
        web:
          service:
            port: 8080
            upstreams: { api: { port: 9091, peer: dc1-dc2 } }
      config_entries:
        - Kind: proxy-defaults
          Name: global
          MeshGateway: { Mode: local }
    dc2:
      servers: 1
      gateways: { mesh: true }
      nodes:
        api:
          service: { port: 9090 }
      config_entries:
        - Kind: service-intentions
          Name: api
          Sources: [{ Name: web, Peer: dc1-dc2, Action: allow }]
