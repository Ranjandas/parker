# Built in the Parker lab builder.
# Bring it up with: parker up externals.yaml
parker: v1alpha1
name: externals
versions: { consul: 2.1.0, envoy: 1.39.1 }
consul:
  defaults:
    tls: true
    acl: true
    service_defaults: { run: fake-service, connect: sidecar }
  external:
    api:
      service: { port: 9000 }
      in: [dc1, dc2]
  peering:
    dc1-dc2:
      acceptor: dc2
      dialer: dc1
      via_mesh_gateways: true
  datacenters:
    dc1:
      servers: 3
      gateways:
        terminating:
          entry: { Services: [{ Name: api }] }
        mesh: true
      nodes:
        web:
          service: { port: 8080, upstreams: { api: 9091 } }
      config_entries:
        - Kind: service-intentions
          Name: api
          Sources: [{ Name: web, Action: allow }]
    dc2:
      servers: 3
      gateways:
        terminating:
          entry: { Services: [{ Name: api }] }
        mesh: true
