# Built in the Parker lab builder.
# Bring it up with: parker up externals.yaml
parker: v1alpha1
name: externals
versions: { consul: 2.1.0, envoy: 1.39.1 }
consul:
  defaults:
    tls: true
    acl: true
    service_defaults: { run: fake-service, connect: sidecar }
  external:
    api:
      service: { port: 9000 }
      in: [dc1, dc2]
  peering:
    dc1-dc2:
      acceptor: dc2
      dialer: dc1
      via_mesh_gateways: true
      exports: { dc2: [api] }
  datacenters:
    dc1:
      servers: 3
      gateways:
        terminating:
          entry: { Services: [{ Name: api }] }
        mesh: true
      nodes:
        web:
          service: { port: 8080, upstreams: { api: 9091 } }
      config_entries:
        - Kind: proxy-defaults
          Name: global
          MeshGateway: { Mode: local }
        - Kind: service-resolver
          Name: api
          ConnectTimeout: 2s
          Failover:
            "*": { Targets: [{ Peer: dc1-dc2 }] }
        - Kind: service-intentions
          Name: api
          Sources: [{ Name: web, Action: allow }]
    dc2:
      servers: 3
      gateways:
        terminating:
          entry: { Services: [{ Name: api }] }
        mesh: true
      config_entries:
        - Kind: service-intentions
          Name: api
          Sources: [{ Name: web, Peer: dc1-dc2, Action: allow }]
scenario:
  steps:
    - wait: dc1 ready
    - wait: dc2 ready
    - name: web reaches api
      assert: { call: { on: dc1/web, reaches: api }, within: 60s }
    - stop: dc1/terminating
    - assert: { call: { on: dc1/web, reaches: api }, within: 60s }
    - start: dc1/terminating
    - assert: { consul: { dc: dc1, service_healthy: api }, within: 60s }
