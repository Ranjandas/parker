# Built in the Parker lab builder.
# Bring it up with: parker up meshfed.yaml
parker: v1alpha1
name: meshfed
versions: { consul: 2.1.0, envoy: 1.39.1 }
consul:
  defaults:
    tls: true
    service_template: { run: fake-service, connect: sidecar }
  federation: { mode: mesh-gateways }
  datacenters:
    dc1:
      servers: 1
      gateways: { mesh: true }
      nodes:
        web:
          service:
            port: 8080
            upstreams: { api: { port: 9091, dc: dc2 } }
      config_entries:
        - Kind: proxy-defaults
          Name: global
          MeshGateway: { Mode: local }
    dc2:
      servers: 1
      gateways: { mesh: true }
      nodes:
        api:
          service: { port: 9090 }
