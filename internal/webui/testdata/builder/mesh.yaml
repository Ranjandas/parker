# Built in the Parker lab builder.
# Bring it up with: parker up mesh.yaml
parker: v1alpha1
name: mesh
versions: { consul: 1.22.7, envoy: 1.35.12 }
consul:
  defaults:
    service_defaults: { run: fake-service, connect: sidecar }
  datacenters:
    dc1:
      servers: 1
      nodes:
        web:
          service: { port: 8080, upstreams: { api: 9091 } }
        api:
          service: { port: 9090 }
