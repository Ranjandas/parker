# Built in the Parker lab builder.
# Bring it up with: parker up dataplane.yaml
parker: v1alpha1
name: dataplane
versions: { consul: 1.22.7, envoy: 1.35.12, consul-dataplane: 1.9.12 }
consul:
  defaults:
    service_defaults: { run: fake-service, connect: sidecar }
  datacenters:
    dc1:
      servers: 3
      nodes:
        web:
          service: { port: 8080, upstreams: { api: 9091 } }
        api:
          agent: dataplane
          service: { port: 9090 }
