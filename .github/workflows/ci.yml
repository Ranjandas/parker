name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 16 * * *" # nightly full e2e (03:00 Melbourne)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "needs gofmt:"; echo "$out"; exit 1; fi
      - run: go vet ./...
      - name: go test (with coverage summary)
        shell: bash # -o pipefail, so a failing test fails the step through tee
        run: |
          go test -race -cover ./... | tee /tmp/test.out
          {
            echo '### Unit test coverage'
            echo '```'
            grep -o 'github.com/Ranjandas/parker/[^ 	]*.*coverage: [0-9.]*%' /tmp/test.out | sed -E 's|github.com/Ranjandas/parker/||; s|\t.*coverage: | |' | grep -v 'internal/api'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: client builds for macOS and arm64
        run: |
          GOOS=darwin GOARCH=arm64 go vet ./...
          GOOS=darwin GOARCH=amd64 go build -o /dev/null ./cmd/parker
          GOOS=linux GOARCH=arm64 go build -o /dev/null ./cmd/parker

  macos:
    # The release's macOS build: cgo for `parker machine`, ad-hoc signed
    # with the virtualization entitlement, as .goreleaser.yaml does it.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go vet ./internal/machine ./cmd/parker
      - run: go test ./internal/machine
      - name: build and sign (arm64, amd64)
        run: |
          for arch in arm64 amd64; do
            CGO_ENABLED=1 GOARCH=$arch go build -trimpath -o "bin/parker-$arch" ./cmd/parker
            codesign --force --sign - --entitlements hack/machine/parker.entitlements "bin/parker-$arch"
            codesign -d --entitlements - "bin/parker-$arch" 2>/dev/null | grep -q com.apple.security.virtualization
          done
          bin/parker-arm64 machine --help >/dev/null

  plan:
    # Which e2e labs to run: on a PR, the ones its changes touch
    # (hack/e2eplan); on main, nightly and by hand, all of them.
    runs-on: ubuntu-24.04
    outputs:
      labs: ${{ steps.plan.outputs.labs }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2 # the PR merge commit and its base parent
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - id: plan
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            git diff --name-only HEAD^1 HEAD | tee /tmp/changed
            labs=$(go run ./hack/e2eplan </tmp/changed)
          else
            labs=$(go run ./hack/e2eplan -all)
          fi
          echo "labs=$labs" >> "$GITHUB_OUTPUT"
          echo "### e2e plan" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$labs\`" >> "$GITHUB_STEP_SUMMARY"

  e2e-lab:
    # One lab per job: full up / exec / down inside `unshare -Urnm`, no
    # sudo for parker itself. "live" is the netsetup round trips plus
    # rootless mode as a normal user.
    name: e2e (${{ matrix.lab }})
    runs-on: ubuntu-24.04
    needs: [test, plan]
    if: needs.plan.outputs.labs != '[]'
    strategy:
      fail-fast: false
      matrix:
        lab: ${{ fromJSON(needs.plan.outputs.labs) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Allow unprivileged user namespaces
        # Ubuntu 24.04 blocks them via AppArmor by default.
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Cache Consul and Envoy binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/parker
          key: parker-bin-${{ runner.os }}-${{ hashFiles('examples/*.yaml', 'hack/e2e/*.yaml') }}
          restore-keys: parker-bin-${{ runner.os }}-
      - run: make build
      - name: lab
        if: matrix.lab != 'live'
        run: hack/rootless-e2e.sh "${{ matrix.lab }}"
        env:
          PARKER_E2E_LOGS: /tmp/parker-e2e-logs
      - name: iptables rules round trip (private netns)
        if: matrix.lab == 'live'
        run: |
          go test -c -o /tmp/netsetup.test ./internal/netsetup/
          PARKER_LIVE_IPTABLES=1 unshare -Urn /tmp/netsetup.test -test.run FirewallLive -test.v
      - name: bridges and namespaces round trip (private netns)
        if: matrix.lab == 'live'
        run: |
          PARKER_LIVE_NETNS=1 unshare -Urnm sh -c 'mount -t tmpfs tmpfs /run && mkdir -p /run/netns && /tmp/netsetup.test -test.run NetsetupLive -test.v'
      - name: rootless mode (no sudo, no unshare wrapper)
        if: matrix.lab == 'live'
        run: make e2e-rootless
        env:
          PARKER_E2E_LOGS: /tmp/parker-e2e-logs
      - name: Upload lab logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs-${{ strategy.job-index }}
          path: /tmp/parker-e2e-logs
          if-no-files-found: ignore

  e2e:
    # One status for the whole matrix: green when every planned lab passed
    # or the PR needed none.
    runs-on: ubuntu-24.04
    needs: [test, macos, plan, e2e-lab]
    if: always()
    steps:
      - run: |
          echo "test: ${{ needs.test.result }}, macos: ${{ needs.macos.result }}, plan: ${{ needs.plan.result }}, labs: ${{ needs.e2e-lab.result }}"
          [ "${{ needs.test.result }}" = success ] && [ "${{ needs.macos.result }}" = success ] && [ "${{ needs.plan.result }}" = success ] || exit 1
          case "${{ needs.e2e-lab.result }}" in success|skipped) ;; *) exit 1 ;; esac
