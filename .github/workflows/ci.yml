name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 16 * * *" # nightly full e2e (03:00 Melbourne)
  workflow_dispatch:

permissions:
  contents: read

# Jobs run on the self-hosted runner (docs/self-hosted-runner.md). To go back
# to GitHub-hosted runners without a code change, set the repository
# variable CI_RUNS_ON to "ubuntu-24.04" (with the quotes: it is JSON).
# Paths go under runner.temp, not /tmp: a self-hosted runner keeps /tmp
# between jobs, runner.temp is emptied after each one.

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["self-hosted","linux","x64"]') }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "needs gofmt:"; echo "$out"; exit 1; fi
      - run: go vet ./...
      - name: go test (with coverage summary)
        shell: bash # -o pipefail, so a failing test fails the step through tee
        run: |
          go test -race -cover ./... | tee "$RUNNER_TEMP/test.out"
          {
            echo '### Unit test coverage'
            echo '```'
            grep -o 'github.com/Ranjandas/parker/[^ 	]*.*coverage: [0-9.]*%' "$RUNNER_TEMP/test.out" | sed -E 's|github.com/Ranjandas/parker/||; s|\t.*coverage: | |' | grep -v 'internal/api'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: client builds for macOS and arm64
        run: |
          GOOS=darwin GOARCH=arm64 go vet ./...
          GOOS=darwin GOARCH=amd64 go build -o /dev/null ./cmd/parker
          GOOS=linux GOARCH=arm64 go build -o /dev/null ./cmd/parker

  plan:
    # Which e2e labs to run: on a PR, the ones its changes touch
    # (hack/e2eplan); on main, nightly and by hand, all of them.
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["self-hosted","linux","x64"]') }}
    outputs:
      labs: ${{ steps.plan.outputs.labs }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2 # the PR merge commit and its base parent
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - id: plan
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            git diff --name-only HEAD^1 HEAD | tee "$RUNNER_TEMP/changed"
            labs=$(go run ./hack/e2eplan <"$RUNNER_TEMP/changed")
          else
            labs=$(go run ./hack/e2eplan -all)
          fi
          echo "labs=$labs" >> "$GITHUB_OUTPUT"
          echo "### e2e plan" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$labs\`" >> "$GITHUB_STEP_SUMMARY"

  e2e-lab:
    # One lab per job: full up / exec / down inside `unshare -Urnm`, no
    # sudo for parker itself. "live" is the netsetup round trips plus
    # rootless mode as a normal user.
    name: e2e (${{ matrix.lab }})
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["self-hosted","linux","x64"]') }}
    needs: [test, plan]
    if: needs.plan.outputs.labs != '[]'
    strategy:
      fail-fast: false
      matrix:
        lab: ${{ fromJSON(needs.plan.outputs.labs) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Allow unprivileged user namespaces
        # Ubuntu 24.04 blocks them via AppArmor by default. Fedora allows
        # them, and the self-hosted runner has no sudo.
        if: runner.environment == 'github-hosted'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Cache Consul and Envoy binaries
        # A self-hosted runner keeps ~/.cache/parker on disk already.
        if: runner.environment == 'github-hosted'
        uses: actions/cache@v4
        with:
          path: ~/.cache/parker
          key: parker-bin-${{ runner.os }}-${{ hashFiles('examples/*.yaml', 'hack/e2e/*.yaml') }}
          restore-keys: parker-bin-${{ runner.os }}-
      - run: make build
      - name: lab
        if: matrix.lab != 'live'
        run: hack/rootless-e2e.sh "${{ matrix.lab }}"
        env:
          PARKER_E2E_LOGS: ${{ runner.temp }}/parker-e2e-logs
      - name: iptables rules round trip (private netns)
        if: matrix.lab == 'live'
        run: |
          go test -c -o "$RUNNER_TEMP/netsetup.test" ./internal/netsetup/
          PARKER_LIVE_IPTABLES=1 unshare -Urn "$RUNNER_TEMP/netsetup.test" -test.run FirewallLive -test.v
      - name: bridges and namespaces round trip (private netns)
        if: matrix.lab == 'live'
        run: |
          PARKER_LIVE_NETNS=1 unshare -Urnm sh -c 'mount -t tmpfs tmpfs /run && mkdir -p /run/netns && "$RUNNER_TEMP/netsetup.test" -test.run NetsetupLive -test.v'
      - name: rootless mode (no sudo, no unshare wrapper)
        if: matrix.lab == 'live'
        run: make e2e-rootless
        env:
          PARKER_E2E_LOGS: ${{ runner.temp }}/parker-e2e-logs
      - name: Upload lab logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs-${{ strategy.job-index }}
          path: ${{ runner.temp }}/parker-e2e-logs
          if-no-files-found: ignore
          retention-days: 7 # artifact storage counts toward the free quota

  e2e:
    # One status for the whole matrix: green when every planned lab passed
    # or the PR needed none.
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["self-hosted","linux","x64"]') }}
    needs: [test, plan, e2e-lab]
    if: always()
    steps:
      - run: |
          echo "test: ${{ needs.test.result }}, plan: ${{ needs.plan.result }}, labs: ${{ needs.e2e-lab.result }}"
          [ "${{ needs.test.result }}" = success ] && [ "${{ needs.plan.result }}" = success ] || exit 1
          case "${{ needs.e2e-lab.result }}" in success|skipped) ;; *) exit 1 ;; esac
