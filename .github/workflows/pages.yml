name: pages

# The website in site/ (static HTML, no build step), served by GitHub Pages
# at https://ranjandas.github.io/parker/. Pull requests that touch it get
# the checks; pushes to main deploy it.

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  pull_request:
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: shellcheck install.sh
        run: shellcheck -s sh site/install.sh
      - name: local links and assets resolve
        shell: python3 {0}
        run: |
          import pathlib, re, sys
          root = pathlib.Path("site")
          bad = []
          for page in root.glob("*.html"):
              html = page.read_text()
              ids = set(re.findall(r'id="([^"]+)"', html))
              for ref in re.findall(r'(?:href|src)="([^"]+)"', html):
                  if re.match(r"^(https?:|mailto:|data:)", ref):
                      continue
                  path, _, frag = ref.partition("#")
                  if path in ("", "./"):
                      target = page if path == "" else root / "index.html"
                  else:
                      target = root / path
                  if not target.exists():
                      bad.append(f"{page.name}: {ref} (missing file)")
                  elif frag and target.suffix == ".html":
                      tids = ids if target == page else set(re.findall(r'id="([^"]+)"', target.read_text()))
                      if frag not in tids:
                          bad.append(f"{page.name}: {ref} (no id {frag})")
          print("\n".join(bad) or "all local links resolve")
          sys.exit(1 if bad else 0)

  deploy:
    if: github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
