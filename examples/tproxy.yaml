# Transparent proxy: web's node sends its outbound TCP through web's Envoy,
# so web reaches api by name (api.virtual.consul, Consul's virtual IP) with
# no upstreams declared. Node DNS goes to the local Consul agent. The
# scenario checks the path works, then that a deny intention stops it.
parker: v1alpha1
name: tproxy
versions: { consul: 1.22.7, envoy: 1.35.12 }
consul:
  datacenters:
    dc1:
      servers: 3
      service_template: { run: fake-service }
      nodes:
        web:
          service: { port: 8080, connect: tproxy }
        api:
          service: { port: 9090, connect: sidecar }

scenario:
  steps:
    - wait: dc1 ready
    - assert: { consul: { service_healthy: web-sidecar-proxy }, within: 60s }
    - assert: { consul: { service_healthy: api-sidecar-proxy }, within: 60s }
    - name: Consul DNS answers on web's node
      assert:
        exec: { on: dc1/web, run: "getent hosts api.virtual.consul" }
        within: 30s
    - name: web reaches api through the mesh
      assert:
        exec: { on: dc1/web, run: "curl -sf -m 2 http://api.virtual.consul:9090/", output: api }
        within: 60s
    - exec: { on: dc1/server-1, run: "consul intention create -deny web api" }
    - name: the intention cuts it
      assert:
        exec: { on: dc1/web, run: "! curl -sf -m 2 http://api.virtual.consul:9090/" }
        within: 30s
