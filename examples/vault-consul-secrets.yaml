# The Consul secrets engine: Vault mints Consul ACL tokens. Parker mounts
# it at consul/ on the east cluster with dc1's management token, and adds
# a role, management, for tokens with the global-management policy.
parker: v1alpha1
name: vault-consul-secrets
versions: { consul: 1.22.7, vault: 1.21.1 }
consul:
  datacenters:
    dc1: { servers: 1, acl: true }
vault:
  clusters:
    east:
      secrets: { consul: dc1 }

scenario:
  steps:
    - wait: east ready
    - assert:
        exec: { on: east/vault-1, run: "vault read consul/creds/management", output: consul_namespace }
        within: 30s
    # The token works in dc1.
    - assert:
        exec:
          on: east/vault-1
          run: "CONSUL_HTTP_TOKEN=$(vault read -field=token consul/creds/management) consul members -http-addr=$(vault read -field=address consul/config/access)"
          output: server-1
        within: 30s
