# Vault on its own: east is three servers on integrated storage (raft)
# with TLS, west one plain-HTTP server. Parker initialises each cluster,
# unseals every server and gives `parker exec` VAULT_ADDR, VAULT_CACERT
# and a root VAULT_TOKEN.
parker: v1alpha1
name: vault
versions: { vault: 1.21.1 }
vault:
  clusters:
    east:
      servers: 3
      tls: true
    west: {}

scenario:
  steps:
    - wait: east ready
    - assert:
        exec: { on: west/vault-1, run: "vault status -format=json", output: "\"sealed\": false" }
        within: 30s
    - exec: { on: east/vault-1, run: "vault operator raft list-peers" }
    - exec: { on: east/vault-2, run: "vault secrets enable -path=secret kv-v2" }
    - exec: { on: east/vault-3, run: "vault kv put secret/hello who=parker" }
    - assert:
        exec: { on: east/vault-1, run: "vault kv get -field=who secret/hello", output: parker }
        within: 10s
    # Fail over: the active server steps down, a standby is sealed and
    # unsealed again, and the secret survives it all.
    # New servers join as non-voters; wait until all three can lead.
    - assert: { vault: { on: east/active, raft_peers: ">=3" }, within: 60s }
    - vault: { step_down: east/active }
    - assert: { vault: { on: east/active, sealed: false }, within: 30s }
    - vault: { seal: east/standbys }
    - assert: { vault: { on: east/standbys, sealed: true }, within: 30s }
    - vault: { unseal: east }
    - assert: { vault: { on: east, sealed: false, raft_peers: ">=3" }, within: 60s }
    - assert:
        exec: { on: east/active, run: "vault kv get -field=who secret/hello", output: parker }
        within: 30s
