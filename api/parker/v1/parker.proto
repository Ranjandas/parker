syntax = "proto3";

package parker.v1;

option go_package = "github.com/Ranjandas/parker/internal/api/parkerv1;parkerv1";

// ParkerService is served by `parker daemon`. The CLI is a client of it.
// Served with ConnectRPC, so it speaks gRPC, gRPC-Web and plain HTTP/JSON:
//
//   curl --unix-socket /run/parker/parker.sock -H 'Content-Type: application/json' \
//     -d '{}' http://parker/parker.v1.ParkerService/ListLabs
service ParkerService {
  // Version of the daemon.
  rpc Version(VersionRequest) returns (VersionResponse);

  // Up creates (or recreates) a lab and returns when every readiness check
  // passes. Progress lines stream back as it goes.
  rpc Up(UpRequest) returns (stream LogLine);

  // Down tears a lab down. Idempotent.
  rpc Down(DownRequest) returns (stream LogLine);

  // ListLabs lists labs that have a run directory.
  rpc ListLabs(ListLabsRequest) returns (ListLabsResponse);

  // Status of one lab's nodes and processes.
  rpc Status(StatusRequest) returns (StatusResponse);

  // Describe one node: its expanded topology (networks, rendered files
  // such as consul.json, processes with command, env and checks) as YAML.
  rpc Describe(DescribeRequest) returns (DescribeResponse);

  // Graph of one lab's architecture, for the web UI's topology view: each
  // node's datacenter, partition and role, which services call which (and
  // through which mesh gateways), and WAN federation and peering links.
  rpc Graph(GraphRequest) returns (GraphResponse);

  // Topology returns the expanded topology a lab was last brought up
  // with, as saved in its run dir (kept by down, removed by down --purge
  // and prune). `parker up LAB` uses it to bring a lab back without its
  // file. NOT_FOUND when the lab has no saved topology.
  rpc Topology(TopologyRequest) returns (TopologyResponse);

  // Validate checks a topology given inline, as `parker validate` does
  // (decode, expand, compatibility warnings), for the web UI's builder.
  rpc Validate(ValidateRequest) returns (ValidateResponse);

  // Logs of one process: the last lines, then (with follow) new ones.
  rpc Logs(LogsRequest) returns (stream LogChunk);

  // Exec runs a command inside a node's network namespace. The first
  // request must carry `start`; then stdin, resize and stdin_eof. With a
  // TTY, stdout carries the terminal output and stderr is unused. Needs
  // HTTP/2 (bidi stream).
  rpc Exec(stream ExecRequest) returns (stream ExecResponse);

  // Dial opens a TCP connection from the daemon to an address inside a
  // running lab and relays bytes both ways. The first request must carry
  // `open`. Used by `parker proxy` and `parker port-forward`.
  rpc Dial(stream DialRequest) returns (stream DialResponse);

  // Shutdown stops the daemon. Labs keep running.
  rpc Shutdown(ShutdownRequest) returns (ShutdownResponse);

  // Run plays a scenario of a running lab, streaming its progress. A
  // failed step ends the stream with FAILED_PRECONDITION.
  rpc Run(RunRequest) returns (stream LogLine);

  // Fake lists, changes or resets the fake services (run: fake-service)
  // on a lab's nodes, or sends one request to a fake from inside its node.
  rpc Fake(FakeRequest) returns (FakeResponse);
}

message VersionRequest {}
message VersionResponse {
  string version = 1;
  int32 pid = 2;
}

message UpRequest {
  // Low-level topology (`parker expand` output), YAML. The client expands
  // the user's file so relative paths resolve on the client side.
  bytes topology_yaml = 1;
  // Leave the lab running if a readiness check fails.
  bool keep_on_failure = 2;
  // Don't add iptables rules; report them instead.
  bool no_firewall = 3;
  // Consul Enterprise license the client resolved (CONSUL_LICENSE,
  // CONSUL_LICENSE_PATH or license.file). The daemon writes it to the lab's
  // run dir (0600) for the agents and never logs or stores it elsewhere.
  bytes consul_license = 4;
  // Bring the lab back on its kept run dir (data, logs) instead of a
  // fresh one, as `parker up LAB` does; fail rather than move its subnets.
  bool resume = 5;
}

message LogLine {
  string line = 1;
}

message DownRequest {
  string lab = 1;
  // Also delete the lab's run dir (logs, configs, data) once it is down.
  bool purge = 2;
}

message ListLabsRequest {}
message ListLabsResponse {
  repeated LabSummary labs = 1;
}

message LabSummary {
  string name = 1;
  int32 namespaces = 2;
  // True if this daemon started the lab and is supervising its processes.
  bool supervised = 3;
}

message StatusRequest {
  string lab = 1;
}

message StatusResponse {
  string lab = 1;
  string run_dir = 2;
  bool supervised = 3;
  repeated NodeStatus nodes = 4;
}

message NodeStatus {
  string name = 1;
  repeated string ips = 2;
  bool namespace = 3; // the node's netns exists
  repeated ProcessStatus processes = 4;
  // Consul role from the node's agent: leader, follower, client; "" if the
  // node has no reachable agent.
  string role = 5;
  // Where the node sits (from its labels): datacenter and admin partition
  // ("" outside partitions:).
  string dc = 6;
  string partition = 7;
  // LAN members the node's agent sees alive, of all it knows; 0/0 without
  // an agent.
  int32 members_alive = 8;
  int32 members_total = 9;
  // Catalog health of the node's service instances, by service name
  // (web, web-sidecar-proxy, mesh-gateway): passing, warning or critical.
  map<string, string> health = 10;
}

message ProcessStatus {
  string name = 1;
  int32 pid = 2;
  bool alive = 3;
  // Known only for labs this daemon supervises.
  optional bool ready = 4;
  int32 restarts = 5;
  string log_path = 6;
  // Frozen by a pause fault.
  bool paused = 7;
  // Down on purpose (a stop fault) until started again.
  bool stopped = 8;
}

message DescribeRequest {
  string lab = 1;
  string node = 2; // dc1-server-1 or dc1/server-1
}

message DescribeResponse {
  string node = 1; // resolved name
  string yaml = 2;
}

message ValidateRequest {
  string yaml = 1;
}

message ValidateResponse {
  bool ok = 1;
  repeated ValidateProblem errors = 2;
  repeated string warnings = 3;
  int32 networks = 4; // when ok, what the lab expands to
  int32 nodes = 5;
}

message ValidateProblem {
  string message = 1;
  int32 line = 2; // 1-based, when the error names one; 0 otherwise
  string path = 3; // the YAML path it names (consul.datacenters.dc1...), if any
}

message TopologyRequest {
  string lab = 1;
}

message TopologyResponse {
  // Low-level topology, YAML, as `parker expand` prints it.
  bytes topology_yaml = 1;
}

message GraphRequest {
  string lab = 1;
}

message GraphResponse {
  string lab = 1;
  repeated GraphNode nodes = 2;
  repeated GraphEdge edges = 3;
  // "", "wan" (servers join over the wan) or "mesh-gateways".
  string federation = 4;
}

message GraphNode {
  string name = 1;
  string dc = 2;
  string partition = 3;
  string role = 4; // server, client, gateway, dataplane or none
  repeated string services = 5;
  repeated string gateways = 6; // mesh, ingress, terminating, api
  repeated string ips = 7;
  repeated GraphLink links = 8; // web UIs the node serves
  // Consul namespace of each service and gateway ("<kind>-gateway"), when
  // its partition has namespaces other than default.
  map<string, string> namespaces = 9;
}

// GraphLink is a web UI on a node, opened through the daemon's app proxy.
message GraphLink {
  string name = 1; // "Consul UI", or a service's name
  int32 port = 2;
  string scheme = 3; // http or https
  string path = 4;
  string token = 5; // signs in to it (the Consul UI's management token)
}

message GraphEdge {
  string kind = 1; // upstream, wan or peering
  string from = 2;
  string to = 3;
  string label = 4;
  repeated string via = 5; // mesh gateways an upstream crosses, in order
}

message LogsRequest {
  string lab = 1;
  string node = 2;
  string process = 3; // default: the node's only process, or "consul"
  int32 tail_lines = 4; // default 50; -1 for the whole file
  bool follow = 5;
}

message LogChunk {
  bytes data = 1;
}

message ShutdownRequest {}
message ShutdownResponse {}

message ExecRequest {
  oneof msg {
    ExecStart start = 1;
    bytes stdin = 2;
    TermSize resize = 3;
    bool stdin_eof = 4;
  }
}

message ExecStart {
  string lab = 1;
  string node = 2; // dc1-server-1 or dc1/server-1
  repeated string argv = 3; // default: $SHELL of the daemon, else /bin/sh
  bool tty = 4;
  TermSize size = 5;
  repeated string env = 6; // extra KEY=VALUE, e.g. TERM
}

message TermSize {
  uint32 rows = 1;
  uint32 cols = 2;
}

message ExecResponse {
  oneof msg {
    bytes stdout = 1;
    bytes stderr = 2;
    int32 exit_code = 3; // last message
  }
}

message DialRequest {
  oneof msg {
    DialOpen open = 1;
    bytes data = 2;
  }
}

message DialOpen {
  // host:port. host is an IP inside a lab network, or a node name:
  // <node>.<lab>.parker, <node>.parker (if unique), or just <node> with lab set.
  string address = 1;
  string lab = 2; // optional scope for bare node names
}

message DialResponse {
  oneof msg {
    DialOpened opened = 1; // first message on success
    bytes data = 2;
  }
}

message DialOpened {
  string remote = 1; // resolved ip:port
}

message RunRequest {
  string lab = 1;
  // Name under scenarios:, or empty for scenario:.
  string scenario = 2;
  // A scenario as YAML ({steps: [...]}) to play instead of the lab's own;
  // parker fault sends one step this way.
  string inline = 3;
}

message FakeRequest {
  string lab = 1;
  // Nodes to act on, as a selector (dc1/web, dc1/*); empty for all.
  string selector = 2;
  // One fake service on those nodes; empty for all of them.
  string service = 3;
  // list (the default), set, reset or call.
  string action = 4;
  // set: the change, a fake: block as JSON ({"errors":{"rate":0.3}}).
  string change_json = 5;
  // call: the path to request (default /) and extra headers, such as
  // X-Parker-Fault. call needs the selector to name one node.
  string path = 6;
  map<string, string> headers = 7;
}

message FakeService {
  string node = 1;
  string service = 2;
  int32 port = 3;
  // http, grpc or tcp.
  string protocol = 4;
  // The faults in force, as JSON (fake.Faults).
  string faults_json = 5;
  // The faults in one line: "health 503 · errors 30% (503) · ...".
  string summary = 6;
  // Set when any fault is injected (failing health, errors, latency or a
  // rate limit).
  bool faulted = 7;
}

message FakeResponse {
  repeated FakeService services = 1;
  // call: the answer's body (a fake's JSON) and HTTP status.
  string call_body = 2;
  int32 call_status = 3;
}
