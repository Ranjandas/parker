syntax = "proto3";

package parker.v1;

option go_package = "github.com/Ranjandas/parker/internal/api/parkerv1;parkerv1";

// ParkerService is served by `parker daemon`. The CLI is a client of it.
// Served with ConnectRPC, so it speaks gRPC, gRPC-Web and plain HTTP/JSON:
//
//   curl --unix-socket /run/parker/parker.sock -H 'Content-Type: application/json' \
//     -d '{}' http://parker/parker.v1.ParkerService/ListLabs
service ParkerService {
  // Version of the daemon.
  rpc Version(VersionRequest) returns (VersionResponse);

  // Up creates (or recreates) a lab and returns when every readiness check
  // passes. Progress lines stream back as it goes.
  rpc Up(UpRequest) returns (stream LogLine);

  // Down tears a lab down. Idempotent.
  rpc Down(DownRequest) returns (stream LogLine);

  // ListLabs lists labs that have a run directory.
  rpc ListLabs(ListLabsRequest) returns (ListLabsResponse);

  // Status of one lab's nodes and processes.
  rpc Status(StatusRequest) returns (StatusResponse);

  // Describe one node: its expanded topology (networks, rendered files
  // such as consul.json, processes with command, env and checks) as YAML.
  rpc Describe(DescribeRequest) returns (DescribeResponse);

  // Logs of one process: the last lines, then (with follow) new ones.
  rpc Logs(LogsRequest) returns (stream LogChunk);

  // Exec runs a command inside a node's network namespace. The first
  // request must carry `start`; then stdin, resize and stdin_eof. With a
  // TTY, stdout carries the terminal output and stderr is unused. Needs
  // HTTP/2 (bidi stream).
  rpc Exec(stream ExecRequest) returns (stream ExecResponse);

  // Dial opens a TCP connection from the daemon to an address inside a
  // running lab and relays bytes both ways. The first request must carry
  // `open`. Used by `parker proxy` and `parker port-forward`.
  rpc Dial(stream DialRequest) returns (stream DialResponse);

  // Shutdown stops the daemon. Labs keep running.
  rpc Shutdown(ShutdownRequest) returns (ShutdownResponse);

  // Run plays a scenario of a running lab, streaming its progress. A
  // failed step ends the stream with FAILED_PRECONDITION.
  rpc Run(RunRequest) returns (stream LogLine);
}

message VersionRequest {}
message VersionResponse {
  string version = 1;
  int32 pid = 2;
}

message UpRequest {
  // Low-level topology (`parker expand` output), YAML. The client expands
  // the user's file so relative paths resolve on the client side.
  bytes topology_yaml = 1;
  // Leave the lab running if a readiness check fails.
  bool keep_on_failure = 2;
  // Don't add iptables rules; report them instead.
  bool no_firewall = 3;
}

message LogLine {
  string line = 1;
}

message DownRequest {
  string lab = 1;
}

message ListLabsRequest {}
message ListLabsResponse {
  repeated LabSummary labs = 1;
}

message LabSummary {
  string name = 1;
  int32 namespaces = 2;
  // True if this daemon started the lab and is supervising its processes.
  bool supervised = 3;
}

message StatusRequest {
  string lab = 1;
}

message StatusResponse {
  string lab = 1;
  string run_dir = 2;
  bool supervised = 3;
  repeated NodeStatus nodes = 4;
}

message NodeStatus {
  string name = 1;
  repeated string ips = 2;
  bool namespace = 3; // the node's netns exists
  repeated ProcessStatus processes = 4;
  // Consul role from the node's agent: leader, follower, client; "" if the
  // node has no reachable agent.
  string role = 5;
}

message ProcessStatus {
  string name = 1;
  int32 pid = 2;
  bool alive = 3;
  // Known only for labs this daemon supervises.
  optional bool ready = 4;
  int32 restarts = 5;
  string log_path = 6;
  // Frozen by a pause fault.
  bool paused = 7;
  // Down on purpose (a stop fault) until started again.
  bool stopped = 8;
}

message DescribeRequest {
  string lab = 1;
  string node = 2; // dc1-server-1 or dc1/server-1
}

message DescribeResponse {
  string node = 1; // resolved name
  string yaml = 2;
}

message LogsRequest {
  string lab = 1;
  string node = 2;
  string process = 3; // default: the node's only process, or "consul"
  int32 tail_lines = 4; // default 50; -1 for the whole file
  bool follow = 5;
}

message LogChunk {
  bytes data = 1;
}

message ShutdownRequest {}
message ShutdownResponse {}

message ExecRequest {
  oneof msg {
    ExecStart start = 1;
    bytes stdin = 2;
    TermSize resize = 3;
    bool stdin_eof = 4;
  }
}

message ExecStart {
  string lab = 1;
  string node = 2; // dc1-server-1 or dc1/server-1
  repeated string argv = 3; // default: $SHELL of the daemon, else /bin/sh
  bool tty = 4;
  TermSize size = 5;
  repeated string env = 6; // extra KEY=VALUE, e.g. TERM
}

message TermSize {
  uint32 rows = 1;
  uint32 cols = 2;
}

message ExecResponse {
  oneof msg {
    bytes stdout = 1;
    bytes stderr = 2;
    int32 exit_code = 3; // last message
  }
}

message DialRequest {
  oneof msg {
    DialOpen open = 1;
    bytes data = 2;
  }
}

message DialOpen {
  // host:port. host is an IP inside a lab network, or a node name:
  // <node>.<lab>.parker, <node>.parker (if unique), or just <node> with lab set.
  string address = 1;
  string lab = 2; // optional scope for bare node names
}

message DialResponse {
  oneof msg {
    DialOpened opened = 1; // first message on success
    bytes data = 2;
  }
}

message DialOpened {
  string remote = 1; // resolved ip:port
}

message RunRequest {
  string lab = 1;
  // Name under scenarios:, or empty for scenario:.
  string scenario = 2;
  // A scenario as YAML ({steps: [...]}) to play instead of the lab's own;
  // parker fault sends one step this way.
  string inline = 3;
}
