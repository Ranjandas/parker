# Release build: `git tag v0.1.0 && git push origin v0.1.0` runs
# .github/workflows/release.yml. Try locally with
#   goreleaser release --snapshot --clean
version: 2
project_name: parker

before:
  hooks:
    - go mod download
    - sh -c "go run ./cmd/parker schema > parker.schema.json"
    # The packages install parker into /usr/bin, so their unit points there.
    - sh -c "mkdir -p build/pkg && sed 's|/usr/local/bin/parker|/usr/bin/parker|' contrib/systemd/parker.service > build/pkg/parker.service"

builds:
  - id: parker
    main: ./cmd/parker
    binary: parker
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{ .Version }} -X main.commit={{ .ShortCommit }} -X main.date={{ .Date }}
    goos: [linux]
    goarch: [amd64, arm64]
  # macOS: client only (exec, logs, status, proxy, port-forward against a
  # daemon on a Linux host). Labs themselves need Linux.
  - id: parker-client
    main: ./cmd/parker
    binary: parker
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{ .Version }} -X main.commit={{ .ShortCommit }} -X main.date={{ .Date }}
    goos: [darwin]
    goarch: [amd64, arm64]

archives:
  - id: parker
    ids: [parker, parker-client]
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - contrib/systemd/parker.service

# .deb and .rpm packages for Linux, attached to the release next to the
# archives (and covered by SHA256SUMS). They install /usr/bin/parker and
# the systemd unit; enable it with `sudo systemctl enable --now parker`.
nfpms:
  - id: packages
    ids: [parker]
    package_name: parker
    file_name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [deb, rpm]
    vendor: Parker
    homepage: https://ranjandas.github.io/parker/
    maintainer: Parker maintainers <https://github.com/Ranjandas/parker/issues>
    description: |-
      Consul labs at probe speed.
      Describe a Consul topology in YAML; Parker runs it in seconds with
      Linux network namespaces, no containers or images.
    bindir: /usr/bin
    section: devel
    contents:
      - src: build/pkg/parker.service
        dst: /usr/lib/systemd/system/parker.service
        file_info: { mode: 0644 }
      - src: README.md
        dst: /usr/share/doc/parker/README.md
        file_info: { mode: 0644 }

checksum:
  name_template: SHA256SUMS
  algorithm: sha256
  extra_files:
    - glob: ./parker.schema.json

release:
  extra_files:
    - glob: ./parker.schema.json

changelog:
  use: github
  sort: asc
  filters:
    exclude: ["^docs:", "^test:", "^chore:"]
